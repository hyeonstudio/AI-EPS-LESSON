<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI-EPS 제주 예멘 난민 수업 견본</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 바(보기 전환·AI 응답 방식) 아래, 학생 보기는 단계 레일 + 작업 패널 2열. 좁은 화면에서는 레일이 가로 띠가 된다.
   중학교 견본과 같은 토큰 체계를 쓰되, 고등 견본은 차시 구분(1/2·2/2)을 레일에 표시한다. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EDEB; --ink:#17201E; --muted:#58665F; --line:#D5DDDA;
  --accent:#1E5D55; --accent-ink:#FFFFFF; --accent-soft:#DDECE9;
  --g:#2D7F4F; --g-bg:#E0F1E6; --y:#8A5F00; --y-solid:#D99A0B; --y-bg:#FFF2D2; --r:#B8342B; --r-bg:#FBE2DF; --off:#5F6C69; --off-bg:#E6EAE9;
  --sea:#2C5B7A; --sea-bg:#E1ECF3;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#18201E; --sunk:#141B19; --ink:#E4EBE9; --muted:#9AA9A4; --line:#2B3633;
  --accent:#6CC2B5; --accent-ink:#0E1A18; --accent-soft:#1D3431;
  --g:#6BCB92; --g-bg:#173325; --y:#F0BE4C; --y-solid:#E5A824; --y-bg:#352A10; --r:#F2867C; --r-bg:#3C1C19; --off:#93A19D; --off-bg:#222B29;
  --sea:#8EC1E3; --sea-bg:#182A36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201E; --sunk:#141B19; --ink:#E4EBE9; --muted:#9AA9A4; --line:#2B3633;
  --accent:#6CC2B5; --accent-ink:#0E1A18; --accent-soft:#1D3431;
  --g:#6BCB92; --g-bg:#173325; --y:#F0BE4C; --y-solid:#E5A824; --y-bg:#352A10; --r:#F2867C; --r-bg:#3C1C19; --off:#93A19D; --off-bg:#222B29;
  --sea:#8EC1E3; --sea-bg:#182A36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;max-width:1260px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap;min-width:0}
.brand b{font-size:19px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13.5px var(--sans);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.aimode{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.aimode .seg button{font-size:12.5px;padding:4px 10px}
main{max-width:1260px;margin:0 auto;padding-block:20px 60px}
button{font-family:var(--sans)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.student{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:4px}
.rail .who{font-size:12.5px;color:var(--muted);padding:0 4px 8px;line-height:1.5}
.rail .who b{color:var(--ink);font-size:13.5px}
.session{font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted);padding:10px 10px 2px;text-transform:uppercase}
.step{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.step .n{grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--sunk);color:var(--muted)}
.step .t{font-weight:600;font-size:13.5px;line-height:1.35}
.step .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step[aria-current="step"]{background:var(--surface);border-color:var(--line)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--accent-soft);color:var(--accent)}
.step:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.Y{background:var(--y-bg);color:var(--y)} .chip.N{background:var(--off-bg);color:var(--off)} .chip.R{background:var(--r-bg);color:var(--r)} .chip.G{background:var(--g-bg);color:var(--g)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,28px);min-width:0}
.stage-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.stage-head h2{margin:0;font-size:22px;text-wrap:balance;line-height:1.3}
.stage-def{color:var(--muted);margin:0 0 14px;max-width:70ch}
.ws{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
.mins{font:600 12px var(--mono);color:var(--muted)}
.signal{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.signal.Y{background:var(--y-bg)} .signal.N{background:var(--off-bg)}
.signal strong{display:block}
.signal .lamp{flex:none;display:flex;flex-direction:column;gap:3px;padding:4px;border-radius:6px;background:#1c2422}
.lamp i{width:9px;height:9px;border-radius:50%;background:#3b4542;display:block}
.signal.Y .lamp i:nth-child(2){background:#F2B32A}

.flow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;list-style:none;padding:0}
.flow li{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.flow li.now{border-color:var(--accent);color:var(--accent);font-weight:600}
.flow li.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.block{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.block.first{border:0;margin:0;padding:0}
.block h3{font-size:16px;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-wrap:balance}
.block .hint{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:72ch}
.locked>.lockbody{opacity:.38;pointer-events:none;user-select:none}
.lockmsg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px;margin-bottom:10px;flex-wrap:wrap}
.lockmsg::before{content:"";width:12px;height:12px;border:2px solid currentColor;border-radius:3px;flex:none}

.gate{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px dashed var(--y-solid);background:var(--y-bg);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.gate b{color:var(--y)}
.gate.ok{border-style:solid;border-color:transparent;background:var(--g-bg)}
.gate.ok b{color:var(--g)}
.gate.req{border-color:var(--r);background:var(--r-bg)}
.gate.req b{color:var(--r)}

.letter{background:var(--sunk);border-radius:12px;padding:16px 18px;font-size:14.5px;max-width:72ch}
.letter p{margin:0 0 8px}
.letter p:last-child{margin:0}
.letter .from{font-size:12.5px;color:var(--muted);margin-bottom:8px}

.list{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:14px}
.casebox .tag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px;white-space:nowrap;margin-right:4px}
.list li .tag{flex:none;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px;white-space:nowrap}
.list li .tag.off{color:var(--off);background:var(--off-bg)}
.list li .txt{flex:1;min-width:0}
.list li .x{flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.aft{font:600 11px var(--mono);color:var(--y);background:var(--y-bg);border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow input,.addrow select{flex:1 1 180px;min-width:0}
.addrow select.narrow{flex:0 1 170px}
input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical;field-sizing:content}
textarea[readonly],input[readonly]{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.sm{font-size:12.5px;padding:4px 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{border-color:var(--r);color:var(--r)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.demo-btn{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seal{font:500 12px var(--mono);color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px}
.small{font-size:12.5px;color:var(--muted)}
.timer{font:600 13px var(--mono);padding:3px 9px;border-radius:6px;background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{background:var(--y-bg);color:var(--y)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lab{font-size:13px;font-weight:600}

.chat{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:12px;padding:14px;max-height:400px;overflow:auto;margin-bottom:10px}
.msg{max-width:80%;padding:9px 13px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px;user-select:none}
.msg.ai.flag{border-color:var(--r);background:var(--r-bg)}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;padding:2px;text-align:center}
.msg .who{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.msg .rep{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer;padding:0 2px;text-decoration:underline}
.persona{display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:13.5px;flex-wrap:wrap}
.persona .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sea-bg);color:var(--sea);display:grid;place-items:center;font-weight:700}
.persona>div{flex:1 1 220px;min-width:0}
.persona em{font-style:normal;color:var(--muted);display:block;font-size:12.5px}
.thinking{color:var(--muted);font-style:italic}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
.tablewrap table{min-width:680px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td select,td input[type=text],td textarea{font-size:13px;padding:5px 7px}
td textarea{min-height:58px}
.ai-ans{user-select:none;white-space:pre-wrap;font-size:13px}
.ai-ans .srcs{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.checks{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.checks label{display:flex;gap:6px;align-items:flex-start}
.checks input{margin-top:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.judge{display:flex;gap:4px;flex-wrap:wrap}
.judge button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 9px;font-size:13px;cursor:pointer;font-weight:600}
.judge button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.fact .no{font:600 12px var(--mono);color:var(--sea)}
.fact .src{font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:4px}
.fact p{margin:0}

.story{border:1px solid var(--line);border-radius:12px;padding:14px 16px;user-select:none;max-width:78ch}
.story.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.story h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.story p{margin:0 0 8px;font-size:14px;line-height:1.75}
.story p:last-child{margin:0}
.scen-l{font:600 12px var(--mono);color:var(--accent);letter-spacing:.04em}
.when{font:600 11.5px var(--mono);border-radius:5px;padding:1px 7px;background:var(--sea-bg);color:var(--sea)}
.stories{display:flex;flex-direction:column;gap:12px}

.redbox{margin-top:6px;border-radius:8px;padding:7px 11px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.redbox.ok{background:var(--g-bg);color:var(--g)}
.redbox.warn{background:var(--y-bg);color:var(--y)}
.redbox.red{background:var(--r-bg);color:var(--r)}
.redbox.idle{background:var(--sunk);color:var(--muted)}
.meter{flex:1 1 100px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:currentColor}
.redbox b{font-family:var(--mono)}
.warnline{font-size:13px;background:var(--y-bg);color:var(--y);border-radius:8px;padding:7px 11px;margin-top:8px}
.warnline.r{background:var(--r-bg);color:var(--r)}

.pend{display:flex;flex-direction:column;gap:2px;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.pend b{color:var(--ink);font-size:13.5px}
.exbox{background:var(--y-bg);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13.5px}
.exbox ul{margin:6px 0 0;padding-left:18px}
.exbox li{margin-bottom:3px}
.casebox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--sunk);max-width:78ch}
.casebox h4{margin:0 0 4px;font-size:15px}
.casebox p{margin:0 0 6px;font-size:14px}
.corebox{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14.5px}
.corebox .small{display:block}
.links{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.links li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:7px 10px;font-size:13.5px}
.links .arr{font:600 14px var(--mono);color:var(--accent)}
.root{font:600 11px var(--mono);color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px}
.scorebtns{display:flex;gap:3px}
.scorebtns button{width:32px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font:600 13px var(--mono);cursor:pointer}
.scorebtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13.5px;cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chain li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:13.5px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.chain li b{font-size:12.5px;color:var(--accent)}
.peer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.peer h4{margin:0;font-size:15px}
.nextbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);margin-top:22px;padding-top:14px}
.demo-hint{border:1px dashed var(--line);border-radius:6px;padding:2px 8px}

/* teacher */
.teacher{display:grid;gap:18px}
.tgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.tcol{display:grid;gap:18px;min-width:0}
.sec-title{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;text-transform:uppercase}
.gates{display:flex;gap:6px;flex-wrap:wrap}
.gates button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px;font-weight:600;cursor:pointer;font-size:13.5px}
.gates button.open{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.prog td{text-align:center;padding:6px 4px}
.prog td:first-child,.prog th:first-child{text-align:left;padding-left:10px}
.cell{display:inline-block;width:22px;height:22px;border-radius:5px;font:500 11px/22px var(--mono);text-align:center}
.cell.d{background:var(--accent-soft);color:var(--accent)} .cell.w{background:var(--sunk);color:var(--muted)} .cell.p{background:var(--y-bg);color:var(--y)} .cell.f{background:var(--r-bg);color:var(--r)}
.review{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.review h4{margin:0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.review ul{margin:0;padding-left:18px;font-size:13px}
.review .row{margin-top:2px}
.ck{font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.ck span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--off)}
.ck .y::before{background:var(--g)} .ck .n::before{background:var(--y-solid)}

- 좋아진 장면과 어려워진 장면을 섞고, 하나의 결말이나 교훈으로 몰아가지 않는다. 마지막 문단을 문제를 암시하는 상징적인 문장으로 끝내지 않는다. 읽는 사람마다 다른 문제를 찾을 수 있어야 한다.
- 원인, 문제점, 교훈을 요약하거나 설명하지 않는다. 무엇이 문제인지 판단하거나 해결책을 제안하지 않는다.
- 모둠이 예측한 반응과 그것들이 서로 부딪힐 때의 결과를 담는다. 목소리를 내기 어려운 이해관계자도 등장시킨다.
- 실존 인물·기관명을 쓰지 않는다. 특정 국가·종교·집단을 일반화하지 않는다. 인물은 가상 이름을 쓴다(유수프는 등장해도 된다).
출력은 JSON 하나: {"A":{"title":"짧은 제목","story":["문단",...]},"B":{...},"C":{...}}`;

let sampleFn=null;
async function getSample(){if(sampleFn)return sampleFn;try{sampleFn=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){sampleFn=null}return sampleFn}
function liveErr(e){
  const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled"].includes(c)){S.live=false;return "실시간 응답을 쓸 수 없어 예시 응답으로 바꿨습니다."}
  if(c==="rate_limited")return "요청이 많아 잠시 뒤에 다시 시도해야 합니다.";
  if(c==="refused")return "이 입력에는 응답하지 않았습니다. 질문을 바꿔 보세요.";
  if(c==="invalid_json")return "응답 형식이 맞지 않았습니다. 다시 시도해 보세요.";
  return "응답을 받지 못했습니다. 다시 시도해 보세요.";
}

const flowList=items=>`<ol class="flow">${items.map(([t,st])=>`<li class="${st}">${esc(t)}</li>`).join("")}</ol>`;
const lockWrap=(on,msg,inner)=>on?`<div class="locked"><div class="lockmsg">${esc(msg)}</div><div class="lockbody">${inner}</div></div>`:inner;
const pendBox=name=>`<div class="pend"><b>${esc(name)}</b><span>선생님이 공개하면 여기에 나타납니다. 그 전에 모둠이 먼저 생각해 봅시다.</span></div>`;
const aftTag=x=>x&&x.aft?`<span class="aft">공개 후</span>`:"";
function signal(g){return g==="Y"
 ?`<div class="signal Y"><span class="lamp" aria-hidden="true"><i></i><i></i><i></i></span><div><strong>노란불 · 먼저 생각하고, 그다음에 AI</strong>모둠이 먼저 만든 것을 저장하면 봉인되고, 선생님이 단계를 열어야 AI를 쓸 수 있습니다. AI의 답은 우리 말로 다시 정리하고, 대화 기록은 자동으로 제출됩니다.</div></div>`
 :`<div class="signal N"><span class="lamp" aria-hidden="true"><i></i><i></i><i></i></span><div><strong>AI 미사용 단계</strong>이 단계는 모둠이 직접 생각하고 토의합니다. 화면에 AI 창이 없습니다.</div></div>`}
function gateBox(n,sealed,what){
  if(!sealed)return "";
  if(S.ai[n])return `<div class="gate ok"><b>선생님이 AI를 열었습니다</b><span>봉인한 ${esc(what)}을(를) 바탕으로 AI를 쓸 수 있습니다.</span></div>`;
  if(S.req[n])return `<div class="gate req"><b>선생님의 보완 요청</b><span>${esc(S.req[n])}</span><button class="btn sm" data-act="unseal" data-n="${n}">봉인 풀고 보완하기</button></div>`;
  return `<div class="gate"><b>선생님 확인 대기</b><span>${esc(what)}이(가) 봉인되었습니다. 선생님이 확인하고 단계를 열면 AI 창이 열립니다.</span><button class="demo-btn" data-act="tOpen" data-n="${n}">시연: 선생님이 연 것으로 처리</button></div>`;
}
function stageDone(n){switch(n){
  case 1:return S.s1.phase>=4;
  case 2:return S.s3.sealed;
  case 3:return S.s3.done;
  case 4:return S.s4.first!==null&&S.s4.improve.trim().length>5;
  case 5:return S.s5.whySaved&&S.s5.newp.trim().length>5;
  case 6:return !!(S.s6.level&&S.s6.types.length&&S.s6.scope&&S.s6.plans.some(p=>p.target&&p.content)&&S.s6.back.length);
  case 7:return S.s7.chk.every(Boolean)&&S.s7.r1.trim().length>5;
 }return false}

let rendering=false;
function render(keepScroll){
  if(rendering)return;rendering=true;
  const y=window.scrollY;
  document.querySelectorAll("#v-student,#v-teacher,#v-plan").forEach(b=>b.setAttribute("aria-pressed",String(b.id==="v-"+S.view)));
  $("#m-demo").setAttribute("aria-pressed",String(!S.live));$("#m-live").setAttribute("aria-pressed",String(S.live));
  try{$("#app").innerHTML=S.view==="student"?renderStudent():S.view==="teacher"?renderTeacher():renderPlan()}
  catch(err){$("#app").innerHTML=`<div class="panel"><b>화면을 그리는 중 문제가 생겼습니다.</b><p class="small">${esc(err.message)}</p></div>`}
  if(keepScroll!==false)window.scrollTo(0,y);
  const c=document.querySelector(".chat");if(c)c.scrollTop=c.scrollHeight;
  rendering=false;
}
function renderStudent(){
  const ses=STAGES[S.stage-1].ses;
  let rail=`<nav class="rail" aria-label="수업 단계"><div class="who"><b>3모둠</b> · 고1 · 4인<br>${ROLES.map((r,i)=>`${r} ${ROSTER[ses][i]}`).join(" · ")}</div>`;
  [1,2].forEach(sn=>{
    rail+=`<div class="session">${sn}/2차시 · 45분</div>`;
    STAGES.filter(s=>s.ses===sn).forEach(st=>{const dis=st.n>S.open;
      rail+=`<button class="step ${stageDone(st.n)?"done":""}" data-stage="${st.n}" ${dis?"disabled":""} ${S.stage===st.n?'aria-current="step"':""}><span class="n">${st.n}</span><span class="t">${esc(st.t)}</span><span class="s">${dis?"선생님이 아직 열지 않음":`<span class="chip ${st.g}">${st.g==="Y"?"YELLOW":"AI 없음"}</span><span>${st.min}분</span>`}</span></button>`});
  });
  rail+=`</nav>`;
  const st=STAGES[S.stage-1];
  const head=`<div class="stage-head"><h2>${st.n}단계 · ${esc(st.t)}</h2><span class="chip ${st.g}">${st.g==="Y"?"YELLOW":"AI 미사용"}</span><span class="ws">${esc(st.ws)}</span><span class="mins">${st.min}분</span>${st.tool?`<span class="small">AI 기능: ${esc(st.tool)}</span>`:""}<button class="demo-btn" data-act="demo" data-n="${st.n}" style="margin-left:auto">시연용 예시 넣기</button></div><p class="stage-def">${esc(st.def)}</p>${signal(st.g)}`;
  const nx=S.stage+1;
  const next=nx>7?"":nx<=S.open?`<div class="nextbar"><button class="btn primary" data-stage="${nx}">${nx}단계로 이동</button></div>`:`<div class="nextbar"><span class="small">${nx}단계는 선생님이 아직 열지 않았습니다.</span><span class="small demo-hint">시연: 교사 화면 → 단계 개방에서 ${nx}을 누르세요.</span></div>`;
  return `<div class="student">${rail}<section class="panel">${head}${[null,s1,s2,s3,s4,s5,s6,s7][S.stage]()}${next}</section></div>`;
}

function timerText(){if(!S.s1.deadline)return "--:--";const r=Math.max(0,Math.round((S.s1.deadline-Date.now())/1000));return String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")}
function s1(){

  const fl=flowList([["편지 읽기","ok"],["① 질문 합의 3'",ph===0?"now":"ok"],["② 1차 대화 4'",ph===1?"now":ph>1?"ok":""],["③ 멈추고 논의 1'",ph===2?"now":ph>2?"ok":""],["④ 2차 대화 2'",ph===3?"now":ph>3?"ok":""],["로그 제출",ph>=4?"ok":""]]);
  const letter=`<div class="block first"><h3>유수프에게서 온 편지 <span class="ws">1-1</span> <span class="mins">2'</span></h3><div class="letter"><div class="from">가상 인물 · 실제 사건을 바탕으로 선생님이 만든 인물입니다.</div>${LETTER.map(p=>`<p>${esc(p)}</p>`).join("")}</div></div>`;

   <ul class="list">${d.qs.map((x,i)=>`<li><span class="tag">${esc(QTYPES[x.type])}</span><span class="txt">${esc(x.t)}${aftTag(x)}</span>${d.sealed?"":`<button class="x" data-act="del" data-k="s1.qs" data-i="${i}">삭제</button>`}</li>`).join("")}</ul>
   ${d.sealed?"":`<div class="addrow"><select id="s1-type" class="narrow" aria-label="질문 유형">${QTYPES.map((t,i)=>`<option value="${i}" ${d.qType===i?"selected":""}>${t}</option>`).join("")}</select><input type="text" id="s1-new" placeholder="모둠이 합의한 질문"><button class="btn" data-act="s1add">추가</button></div>
   ${miss.length&&d.qs.length?`<div class="warnline">아직 없는 유형: ${esc(miss.join(", "))}</div>`:""}

   <div class="row"><button class="btn primary" data-act="s1seal" ${d.qs.length<4||d.qs.length>5?"disabled":""}>합의 완료 · 질문 봉인</button><span class="small">${d.qs.length}개 · 4~5개여야 저장할 수 있습니다. 저장하면 고칠 수 없고 시각이 기록됩니다.</span></div>`}
   ${gateBox(1,d.sealed,"질문 목록")}</div>`;
  const busy=d.chat.some(m=>m.wait);

   <div class="chat" aria-live="polite">${d.chat.length?d.chat.map((m,i)=>m.r==="sys"?`<div class="msg sys">${esc(m.x)}</div>`:m.r==="me"?`<div class="msg me">${esc(m.x)}</div>`:`<div class="msg ai ${m.flag?"flag":""}"><span class="who">유수프${m.flag?" · 신고됨":""}${m.wait||m.flag?"":`<button class="rep" data-act="report" data-i="${i}">일반화 표현 신고</button>`}</span>${m.wait?`<span class="thinking">${esc(m.x||"생각하는 중…")}</span>`:esc(m.x)}</div>`).join(""):'<div class="msg sys">선생님이 열면 합의한 질문을 골라 보낼 수 있습니다.</div>'}</div>

   <p class="small" style="margin:8px 0 0">${ph>=4?`<span class="seal">로그 제출됨 ${hm(d.endT)}</span> 1·2차 대화 로그가 제출되었습니다.`:"대화를 마치면 1·2차 대화 로그가 자동으로 제출됩니다."}</p></div>`;
  return fl+letter+q+lockWrap(!(d.sealed&&S.ai[1]),"질문을 봉인하고 선생님이 단계를 열어야 대화할 수 있습니다.",c1)+lockWrap(ph<2,"1차 대화를 멈춰야 논의가 열립니다.",disc)+lockWrap(ph<3,"논의 결과를 저장해야 2차 대화가 열립니다.",c2);

   ${ais.length?`<div class="tablewrap"><table><thead><tr><th style="width:46%">유수프의 말(대화 내용)</th><th>구분</th><th>근거 기사</th></tr></thead><tbody>${ais.map(({m,i})=>{const c=d.cls[i]||{};return `<tr><td class="ai-ans">${esc(m.x.replace(PERSONA_PRE,""))}</td><td><div class="judge" role="group" aria-label="구분">${["확인된 이야기","창작된 이야기"].map(o=>`<button data-act="cls" data-i="${i}" data-v="${o}" aria-pressed="${c.v===o}">${o}</button>`).join("")}</div></td><td><select data-bind="s2.cls.${i}.art" aria-label="근거 기사" ${c.v==="확인된 이야기"?"":"disabled"}><option value="">-</option>${ARTICLES.map((a,k)=>`<option value="${k+1}" ${String(c.art)===String(k+1)?"selected":""}>기사 ${k+1}</option>`).join("")}</select></td></tr>`}).join("")}</tbody></table></div>`:`<div class="pend"><b>대화 기록이 없습니다</b><span>1단계에서 유수프와 대화하면 응답이 여기에 나타납니다.</span></div>`}

   ${PI.test(Object.values(L).join(" "))?`<div class="warnline r">전화번호나 이메일 같은 개인정보가 들어 있습니다.</div>`:""}</div>`;

  const guess=`<div class="block"><h3>원인 추측하기 <span class="ws">2-4</span> <span class="mins">2'</span> <span class="chip N">AI 미사용</span></h3><p class="hint">유수프는 전쟁을 피해 왔는데 왜 여기서도 안정적으로 지내기 어려울까요? 각자 기록지 2-4에 먼저 추측한 뒤, 모둠에서 비교해 합의한 원인을 모둠원 수만큼(${NEED()}개) 이상 입력합니다. 원인을 한 사람이 하나씩 맡아 검증합니다.</p>
   <ul class="list">${d.guesses.map((g,i)=>`<li><span class="tag">원인 ${i+1}</span><span class="txt">${esc(g.t)}</span>${S.s3.sealed?"":`<button class="x" data-act="del" data-k="s2.guesses" data-i="${i}">삭제</button>`}</li>`).join("")}</ul>
   ${S.s3.sealed?"":`<div class="addrow"><input type="text" id="s2-g" placeholder="모둠이 합의한 원인"><button class="btn" data-act="s2g">추가</button></div>`}
   <p class="small" style="margin:6px 0 0">${d.guesses.length}/${NEED()}개 이상${d.guesses.length<NEED()?` · ${NEED()}개가 되면 원인 확인 질문을 정할 수 있습니다.`:""}</p>
   ${biasHit?`<div class="warnline">선생님 질문: 같은 예멘인 신청자도 결과가 달랐던 이유는 무엇일까요? 개인의 노력만으로 해결될 수 있을까요? 원인을 제도와 여론의 층위에서 다시 생각해 봅시다.</div>`:""}</div>`;
  const vq=`<div class="block"><h3>원인 확인 질문 정하기 <span class="ws">2-5</span> <span class="mins">3'</span> ${S.s3.sealed?`<span class="seal">봉인 ${hm(S.s3.sealT)}</span>`:""}</h3><p class="hint">추측한 원인이 맞는지 확인하려면 어떤 정보가 필요할까요? 개인의 노력만으로 해결될 수 있는지, 제도나 여론이 어떤 영향을 주었는지 생각해 봅니다. 모둠원이 원인을 하나씩 나누어 맡고, 맡은 원인마다 질문을 1개씩(모두 ${NEED()}개) 정합니다. 확인할 것이 여럿이면 한 질문에 묶고, 더 필요한 근거는 3단계의 ‘근거 다시 묻기’로 보충합니다. 저장하고 칠판에도 붙여 다른 모둠과 겹치거나 충돌하는 질문을 확인합니다. 3단계에서는 각자 맡은 질문만 AI에게 물을 수 있습니다.</p>

   ${gateBox(3,S.s3.sealed,"원인 확인 질문")}</div>`;
  return fl+facts+cmp+life+guess+lockWrap(d.guesses.length<NEED()&&!S.s3.sealed,`2-4에서 모둠이 합의한 원인을 모둠원 수만큼(${NEED()}개) 이상 적어야 원인 확인 질문을 정할 수 있습니다.`,vq);

/* ---------- 3단계 ---------- */
function syncRows(){
  const d=S.s3;
  if(d.rows.length!==S.s2.vq.length||d.rows.some((r,i)=>r.q!==S.s2.vq[i].q))
    d.rows=S.s2.vq.map(v=>({q:v.q,cause:v.cause,who:v.who||"",ans:null,src:[],fu:"",sum:"",res:"",ck:[false,false,false,false],j:"",why:"",wait:false,err:""}));
}
function s3(){
  const d=S.s3;syncRows();
  if(!d.rows.length)return `<div class="pend"><b>원인 확인 질문이 없습니다</b><span>2단계에서 원인 확인 질문을 4개 이상 먼저 만듭니다.</span></div>`;
  const asked=d.rows.every(r=>r.ans),judged=asked&&d.rows.every(r=>r.j&&r.res.trim()&&r.sum.trim()&&(r.why||"").trim());
  const fl=flowList([["질문 봉인(2-5)",d.sealed?"ok":"now"],["AI로 정보 수집 3'",d.sealed&&!asked?"now":asked?"ok":""],["출처 확인·판정 5'",asked&&!judged?"now":judged?"ok":""],["원인 관계도 4'",judged&&!d.root?"now":d.root?"ok":""],["핵심 원인 2'",d.root&&!d.done?"now":d.done?"ok":""]]);
  const seal=`<div class="block first"><h3>원인 확인 질문 <span class="small">2단계 2-5</span> ${d.sealed?`<span class="seal">봉인 ${hm(d.sealT)}</span>`:""}</h3>
   <ul class="list">${d.rows.map((r,i)=>`<li><span class="tag">질문 ${i+1}</span><span class="txt">${esc(r.q)}${r.who?`<br><span class="small">맡은 사람: ${esc(r.who)}</span>`:""}</span></li>`).join("")}</ul>
   ${d.sealed?gateBox(3,d.sealed,"원인 확인 질문"):`<div class="pend"><b>아직 봉인 전입니다</b><span>2단계 2-5에서 원인 확인 질문을 저장·봉인합니다.</span></div>`}</div>`;
  const tbl=`<div class="block"><h3>원인 확인 질문으로 얻은 정보 검증하기 <span class="ws">3-1</span></h3><p class="hint">질문 입력창은 없습니다. 모둠원은 각자 맡은 질문을 학생용 프롬프트 형식 그대로 보내고, AI가 제시한 출처에 직접 접속해 확인합니다. 출처가 미비하면 검증 자료 목록과 추가 검색으로 확인합니다. 판정은 모둠원이 함께 논의해 정합니다. AI가 말한 출처는 직접 확인하기 전까지 믿지 않습니다.</p>
   <div class="tablewrap"><table style="min-width:1040px"><thead><tr><th style="width:14%">원인 확인 질문</th><th style="width:21%">AI 응답과 제시한 출처</th><th style="width:17%">AI 응답의 핵심(우리 말로)</th><th style="width:17%">직접 확인한 결과</th><th style="width:16%">검증 체크리스트</th><th>판정과 이유</th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr>
    <td><span class="small">질문 ${i+1}${r.who?` · ${esc(r.who)}`:""}</span><br>${esc(r.q)}</td>
    <td>${r.ans?`<div class="ai-ans">${esc(r.ans)}<span class="srcs">출처: ${r.src.map(esc).join(" / ")||"없음"}</span>${r.fu?`<span class="srcs" style="color:var(--ink)">근거 다시 묻기 → ${esc(r.fu)}</span>`:`<button class="btn sm" style="margin-top:6px" data-act="s3fu" data-i="${i}" ${r.wait?"disabled":""}>근거 다시 묻기</button>`}</div>`:r.wait?`<span class="thinking">답을 쓰는 중…</span>`:`<button class="btn primary sm" data-act="s3ask" data-i="${i}">AI에게 질의</button><span class="small" style="display:block;margin-top:4px">"…답의 근거가 된 자료의 기관명·자료명·날짜를 함께 제시해 줘. 확인할 수 없는 내용은 '확인 불가'라고 표시해 줘. 원인이 무엇인지 판단하지는 마."</span>`}${r.err?`<div class="warnline">${esc(r.err)}</div>`:""}</td>
    <td><textarea id="s3-sum-${i}" data-bind="s3.rows.${i}.sum" data-red="s3-sum-${i}" data-st="3" ${r.ans?"":"disabled"} aria-label="AI 응답의 핵심" placeholder="우리 말로 한 줄">${esc(r.sum)}</textarea>${r.ans?redHtml("s3-sum-"+i,r.sum):""}</td>
    <td><textarea data-bind="s3.rows.${i}.res" ${r.ans?"":"disabled"} placeholder="자료 내용 / 출처(기관·문서명, 날짜)" aria-label="직접 확인한 결과">${esc(r.res)}</textarea></td>
    <td><div class="checks">${VERIFY.map((c,k)=>`<label><input type="checkbox" data-bind="s3.rows.${i}.ck.${k}" ${r.ck[k]?"checked":""} ${r.ans?"":"disabled"}> ${esc(c)}</label>`).join("")}</div></td>

   <p class="small" style="margin:8px 0 0">○ 출처를 확인했고 원자료와 일치 · △ 확인하지 못했거나 자료마다 다름 · × 원자료와 다르거나 출처가 없음</p>
   <details class="pd"><summary>검증 자료 목록 (선생님 제공)</summary><ul class="small" style="margin:8px 0 0;padding-left:18px">${ARTICLES.flatMap(a=>a.src).filter(s=>s.u).map(s=>`<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join("")}</ul><p class="small">검색 엔진의 AI 요약이나 출처가 불분명한 게시물은 검증 자료로 인정하지 않습니다.</p></details></div>`;
  const acc=d.rows.filter(r=>r.j==="수용");
  const causes=[...new Set([...S.s2.guesses.map(g=>g.t),...d.rows.map(r=>r.cause).filter(Boolean)])];
  const core=`<div class="block"><h3>원인 관계도 그리기 <span class="ws">3-2</span> <span class="mins">4'</span> <span class="chip N">AI 미사용</span></h3><p class="hint">수용한 정보만 근거로 원인들을 화살표로 연결합니다. 이것이 해결되면 다른 원인도 함께 풀리는 원인은 무엇인가요?</p>
   ${(()=>{const un=S.s2.guesses.map(g=>g.t).filter(t=>!d.rows.some(r=>r.cause===t));return un.length?`<p class="small">미확인 원인(맡은 사람 없음): ${un.map(esc).join(" / ")} · 근거가 없으므로 화살표에 쓰지 않습니다.</p>`:""})()}<p class="small">수용한 정보 ${acc.length}건${acc.length?": "+acc.map(r=>esc(r.sum.slice(0,40))+(r.sum.length>40?"…":"")).join(" / "):""}</p>
   <ul class="links">${d.links.map((l,i)=>`<li><span>${esc(l[0])}</span><span class="arr">→</span><span>${esc(l[1])}</span><button class="btn sm" data-act="del" data-k="s3.links" data-i="${i}" style="margin-left:auto">삭제</button></li>`).join("")}</ul>
   <div class="addrow"><select id="s3-la" aria-label="원인 A"><option value="">원인 A</option>${causes.map(c=>`<option>${esc(c)}</option>`).join("")}</select><span class="arr" aria-hidden="true">→</span><select id="s3-lb" aria-label="원인 B"><option value="">원인 B (A 때문에 생기는 것)</option>${causes.map(c=>`<option>${esc(c)}</option>`).join("")}</select><button class="btn" data-act="s3link">화살표 추가</button></div>
   <div class="field" style="margin-top:10px"><label for="s3-root">다른 원인을 함께 풀 수 있는 원인</label><select id="s3-root" data-bind="s3.root"><option value="">선택</option>${causes.map(c=>`<option ${d.root===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
   <h3 style="margin-top:16px">핵심 원인 정하기 <span class="ws">3-3</span> <span class="mins">2'</span></h3><p class="hint">AI의 문장을 옮기지 않고 우리 말로 씁니다. 출처를 확인하지 못한 정보는 근거로 쓰지 않습니다.</p><div class="corebox"><span class="small">모둠이 정한 핵심 원인과 근거</span>유수프의 체류가 불안정한 핵심 원인은 (<input type="text" data-bind="s3.coreC" data-red="s3-coreC" data-st="3" value="${esc(d.coreC)}" style="display:inline-block;width:auto;min-width:min(260px,100%);margin:4px 2px" aria-label="핵심 원인">)이며, 그 근거는 (<input type="text" data-bind="s3.coreE" data-red="s3-coreE" data-st="3" value="${esc(d.coreE)}" style="display:inline-block;width:auto;min-width:min(260px,100%);margin:4px 2px" aria-label="근거">)이다.</div>
   ${redHtml("s3-core",d.coreC+" "+d.coreE)}
   <div class="row"><button class="btn primary" data-act="s3done" ${d.coreC.trim()&&d.coreE.trim()&&acc.length?"":"disabled"}>핵심 원인 공유 · 로그 제출 확인</button>${d.done?`<span class="seal">제출됨 ${hm(d.doneT)}</span>`:`<span class="small">수용한 정보가 1건 이상 있어야 합니다. 전자칠판에 핵심 원인 문장이 올라갑니다.</span>`}</div></div>`;
  return fl+seal+lockWrap(!(d.sealed&&S.ai[3]),"2단계에서 원인 확인 질문을 봉인하고 선생님이 3단계를 열어야 질의할 수 있습니다.",tbl)+lockWrap(!judged,"모든 질문에 핵심 요약, 직접 확인 결과, 판정과 이유를 적어야 열립니다.",core);
}

/* ---------- 4단계 ---------- */
function coreText(){return S.s4.pinned?S.s4.coreEdit:(S.s3.coreC?`${S.s3.coreC} (근거: ${S.s3.coreE})`:"")}
function s4(){
  const d=S.s4;
  if(!d.pinned&&!d.coreEdit&&S.s3.coreC)d.coreEdit=`${S.s3.coreC} (근거: ${S.s3.coreE})`;
  const nCase=helpVis("case");
  const judged=d.fb&&d.fb.every(f=>f.j&&f.why.trim()&&f.sum.trim());
  const rated=judged&&d.fb.every(f=>f.r.every(Boolean));
  const fl=flowList([["① 핵심 원인 고정 3'",d.pinned?"ok":"now"],["② 첫 사례 살펴보기 3'",d.pinned&&!d.sealed?"now":d.sealed?"ok":""],["③ 대안 만들기 4'",d.pinned&&!d.sealed?"now":d.sealed?"ok":""],["④ AI 피드백 판단 2'",d.sealed&&!judged?"now":judged?"ok":""],["⑤ 비교표·1순위 4'",judged&&d.first===null?"now":d.first!==null?"ok":""]]);
  const pin=`<div class="block first"><h3>우리 모둠의 핵심 원인 <span class="ws">4-1</span> <span class="mins">3'</span> ${d.pinned?`<span class="seal">고정 ${hm(d.pinT)}</span>`:""}</h3>
   ${d.pinned?`<div class="corebox">${esc(d.coreEdit)}</div><p class="hint" style="margin-top:8px">오늘 만드는 대안은 이 원인을 해결하기 위한 것이어야 합니다.</p>`:`<p class="hint">지난 시간에 확정한 핵심 원인을 고정합니다. 근거가 약하면 검증표를 보고 문장을 다듬은 뒤 고정합니다.</p><textarea id="s4-core" data-bind="s4.coreEdit" placeholder="1차시 3단계에서 확정한 핵심 원인 문장">${esc(d.coreEdit)}</textarea><div class="row"><button class="btn primary" data-act="s4pin" ${d.coreEdit.trim().length>5?"":"disabled"}>핵심 원인 고정</button></div>`}</div>`;
  const cases=`<div class="block"><h3>유사 사례에서 아이디어 얻기 <span class="ws">4-2</span> <span class="mins">3'</span> <span class="small">선생님이 공개</span></h3>
   ${nCase?`<p class="hint">해결책을 고르는 자료가 아닙니다. 그 사례에서는 문제가 어떻게 해결되었는지 살펴보고, 핵심 아이디어를 정리합니다. 아이디어가 더 필요하면 선생님께 다음 사례를 요청합니다.</p><div class="casegrid">${CASES.slice(0,nCase).map((c,i)=>{const n=d.notes[i];return `<div class="casebox"><span class="small">사례 ${i+1}${i===0?" · 학급 전체 공개":" · 추가 공개"}</span><h4>${esc(c.title)}</h4><p class="small" style="margin:0 0 6px"><span class="tag">${esc(c.actor)}</span> 겨냥한 어려움: ${esc(c.aim)}</p><p>${esc(c.body)}</p><span class="small">생각해 볼 점: ${esc(c.ask)}<br>출처: ${esc(c.src)}</span>
     <label class="small" for="s4-id${i}">핵심 아이디어</label><input type="text" id="s4-id${i}" data-bind="s4.notes.${i}.idea" value="${esc(n.idea)}"></div>`}).join("")}</div>`:pendBox("유사 사례")}
   ${helpVis("alt")?`<div class="exbox" style="margin-top:12px"><b class="small">선생님이 공개한 대안 예시</b> <span class="small">그대로 옮기지 말고 우리 핵심 원인에 맞게 바꿔 씁니다. 공개 뒤 만든 대안은 '공개 후'로 표시됩니다.</span><ul>${ALT_EX.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}</div>`;
  const list=`<ul class="list">${d.alts.map((a,i)=>{const sim=overlapWith(a.txt,caseTexts());return `<li><span class="tag">${esc(a.actor)}</span><span class="txt">${esc(a.txt)}${aftTag(a)}${sim!==null&&sim>=.4?`<br><span class="simwarn">사례·예시와 표현이 많이 겹칩니다 (${Math.round(sim*100)}%). 우리 원인과 상황에 맞게 바꿨나요?</span>`:""}</span>${d.sealed?"":`<button class="x" data-act="del" data-k="s4.alts" data-i="${i}">삭제</button>`}</li>`}).join("")}</ul>`;
  const add=d.sealed?"":`<div class="altform"><input type="text" id="s4-txt" placeholder="우리 모둠이 생각한 대안"><select id="s4-actor" aria-label="실행 주체">${ACTORS.map(t=>`<option>${t}</option>`).join("")}</select><button class="btn" data-act="s4add">추가</button></div>
   <div class="row"><button class="btn primary" data-act="s4seal" ${d.alts.length>=3?"":"disabled"}>대안 확정 · 봉인</button><span class="small">${d.alts.length}/3개 이상 · 대안마다 실행 주체를 고릅니다.</span></div>`;
  const alt=`<div class="block"><h3>행위 주체별 대안 만들기 <span class="ws">4-3</span> <span class="mins">4'</span> <span class="chip N">AI 미사용</span> ${d.sealed?`<span class="seal">봉인 ${hm(d.sealT)}</span>`:""}</h3><p class="hint">각자 기록지에 먼저 생각한 뒤 모둠에서 결합하여 3개 이상 정합니다. 모든 대안은 4-1의 핵심 원인을 해결하기 위한 것이고, 대안마다 실행 주체(국가, 국제기구, 비정부 기구, 세계시민)를 고릅니다.</p>${list}${add}${gateBox(4,d.sealed,"대안표")}</div>`;
  const fb=`<div class="block"><h3>AI 피드백 판단하기 <span class="ws">4-4</span> <span class="mins">2'+</span></h3><p class="hint">대안 검토 도우미는 강점과 약점만 말합니다. 새 대안을 내거나 순위를 매기지 않습니다. 피드백을 우리 말로 요약하고, 수용·수정·기각과 그 이유를 적습니다. 최종 선정은 모둠이 합니다.</p>
   ${d.fb?`<div class="tablewrap"><table style="min-width:900px"><thead><tr><th>모둠 대안</th><th>AI의 피드백</th><th>강점·약점(우리 말로)</th><th>판단과 이유</th></tr></thead><tbody>${d.fb.map((x,i)=>`<tr>
    <td><span class="small">${esc(d.alts[i].actor)}</span><br>${esc(d.alts[i].txt)}</td>
    <td class="ai-ans"><b class="small">강점</b> ${x.s.map(esc).join(" / ")}<br><b class="small">약점</b> ${x.w.map(esc).join(" / ")}</td>
    <td><textarea id="s4-sum-${i}" data-bind="s4.fb.${i}.sum" data-red="s4-sum-${i}" data-st="4" aria-label="강점·약점 요약">${esc(x.sum)}</textarea>${redHtml("s4-sum-"+i,x.sum)}</td>
    <td><div class="judge" role="group" aria-label="판단">${["수용","수정","기각"].map(v=>`<button data-act="s4j" data-i="${i}" data-v="${v}" aria-pressed="${x.j===v}">${v}</button>`).join("")}</div><input type="text" data-bind="s4.fb.${i}.why" value="${esc(x.why)}" placeholder="판단 이유(한 문장)" style="margin-top:6px" aria-label="판단 이유"></td></tr>`).join("")}</tbody></table></div>`
   :d.fbWait?`<p class="thinking">대안 검토 도우미가 피드백을 쓰는 중…</p>`:`<button class="btn primary" data-act="s4fb">대안 검토 도우미에 피드백 요청</button>`}
   ${d.fbErr?`<div class="warnline">${esc(d.fbErr)}</div>`:""}</div>`;
  const cmp=`<div class="block"><h3>대안 비교표 <span class="ws">4-5</span></h3><p class="hint">각자 1~3점을 매긴 뒤 모둠에서 비교해 모둠 점수를 입력합니다. 실현 가능성: 실행 주체가 실제로 해낼 수 있는가? · 원인 해결 정도: 핵심 원인을 얼마나 해결하는가? · 이해관계자 수용성: 영향을 받는 사람들이 받아들일 수 있는가?</p>
   ${d.fb?`<div class="tablewrap"><table style="min-width:820px"><thead><tr><th>대안</th>${CRIT.map(c=>`<th>${c}</th>`).join("")}<th>합계</th><th>점수의 근거 [선택]</th></tr></thead><tbody>${d.fb.map((x,i)=>{const sum=x.r.reduce((a,b)=>a+(b||0),0);return `<tr><td>${i+1}. ${esc(d.alts[i].txt)}</td>${CRIT.map((c,k)=>`<td><div class="scorebtns" role="group" aria-label="${c}">${[1,2,3].map(v=>`<button data-act="score" data-i="${i}" data-k="${k}" data-v="${v}" aria-pressed="${x.r[k]===v}">${v}</button>`).join("")}</div></td>`).join("")}<td class="num"><b>${sum||"-"}</b></td><td><input type="text" data-bind="s4.fb.${i}.rw" value="${esc(x.rw)}" placeholder="[선택]" aria-label="점수의 근거"></td></tr>`}).join("")}</tbody></table></div>`:""}</div>`;
  const tot=d.fb?d.fb.map(x=>x.r.reduce((a,b)=>a+(b||0),0)):[];
  const first=`<div class="block"><h3>1순위 대안 정하기 <span class="ws">4-6</span></h3><p class="hint">비교표를 근거로 다른 대안보다 나은 이유를 쓰고, 피드백을 반영해 보완한 내용을 함께 씁니다.</p>
   <div class="checks" style="font-size:14px;gap:6px">${(d.fb||[]).map((x,i)=>`<label><input type="radio" name="s4first" data-act="first" data-i="${i}" ${d.first===i?"checked":""}> ${esc(d.alts[i].txt)} <span class="small">(합계 ${tot[i]||"-"})</span></label>`).join("")}</div>
   ${d.first!==null&&tot.length&&tot[d.first]<Math.max(...tot)?`<div class="warnline">합계가 가장 높은 대안이 아닙니다. 그래도 고른 이유를 아래에 함께 씁니다.</div>`:""}
   <label class="small" for="s4-improve" style="display:block;margin-top:8px">모둠이 정한 1순위 대안, 고른 이유와 보완한 내용</label><textarea id="s4-improve" data-bind="s4.improve" data-red="s4-improve" data-st="4">${esc(d.improve)}</textarea>${redHtml("s4-improve",d.improve)}</div>`;
  return fl+pin+lockWrap(!d.pinned,"핵심 원인을 고정해야 열립니다.",cases+alt)+lockWrap(!(d.sealed&&S.ai[4]),"대안을 봉인하고 선생님이 단계를 열어야 피드백을 받을 수 있습니다.",fb)+lockWrap(!judged,"모든 피드백에 요약, 판단, 이유를 적어야 열립니다.",cmp)+lockWrap(!rated,"비교표 점수를 모두 매겨야 1순위를 고를 수 있습니다.",first);
}

/* ---------- 5단계 ---------- */
function firstAlt(){const d=S.s4;if(d.first===null)return "";return d.improve.trim()||d.alts[d.first].txt}
function s5(){
  const d=S.s5,fa=firstAlt();
  const nIn=d.preds.filter(p=>!p.ex).length,nEx=d.preds.filter(p=>p.ex).length;
  const chosen=d.whySaved;
  const fl=flowList([["반응 예측 4'",d.sealed?"ok":"now"],["AI 시나리오 2'",d.sealed&&!d.scen?"now":d.scen?"ok":""],["고르기와 이유",d.scen&&!chosen?"now":chosen?"ok":""],["새로운 문제",chosen&&!d.newp.trim()?"now":d.newp.trim()?"ok":""]]);
  const p=`<div class="block first"><h3>이해관계자 반응 예측하기 <span class="ws">5-1·5-2</span> <span class="mins">4'</span> <span class="chip N">AI 미사용</span> ${d.sealed?`<span class="seal">봉인 ${hm(d.sealT)}</span>`:""}</h3>
   <p class="small" style="margin:0 0 6px">우리 1순위 대안: <b>${esc(fa||"4단계에서 1순위 대안을 먼저 정합니다.")}</b></p>
   <p class="hint">AI 없이 먼저 모둠원들과 토의하여 예측합니다. 1순위 대안이 실행되면 영향을 받는 사람을 2명 이상 찾고, 각자 어떻게 반응할지 근거와 함께 씁니다. <span class="ws">5-1</span></p>
   <ul class="list">${d.preds.map((x,i)=>`<li><span class="tag ${x.ex?"off":""}">${esc(x.who)}${x.ex?" · 목소리를 내기 어려움":""}</span><span class="txt">${esc(x.txt)}${x.reason?`<br><span class="small">그렇게 예측한 이유: ${esc(x.reason)}</span>`:""}${x.why?`<br><span class="small">목소리를 내기 어려운 이유: ${esc(x.why)}</span>`:""}${aftTag(x)}</span>${d.sealed?"":`<button class="x" data-act="del" data-k="s5.preds" data-i="${i}">삭제</button>`}</li>`).join("")}</ul>
   ${d.sealed?"":`<div class="addrow"><input type="text" id="s5-who" placeholder="이해관계자" style="flex:0 1 180px"><input type="text" id="s5-txt" placeholder="예측한 반응"><input type="text" id="s5-rsn" placeholder="그렇게 예측한 이유"><button class="btn" data-act="s5add">추가</button></div>
   ${helpVis("who")?`<div class="exbox"><b class="small">선생님이 공개한 이해관계자 예시</b> <span class="small">누르면 이해관계자 칸에 들어갑니다. 반응은 모둠이 직접 예측합니다.</span><div class="chips">${WHO_EX.map(w=>`<button class="chipbtn" data-act="whoex" data-v="${esc(w)}">${esc(w)}</button>`).join("")}</div></div>`:pendBox("이해관계자 예시")}
   <div class="exq"><b>목소리를 내기 어려운 이해관계자 <span class="ws">5-2</span></b><p class="small" style="margin:2px 0 8px">이 대안을 정하는 자리에 없었던 사람, 영향을 받지만 의견을 말하기 어려운 사람은 누구일까요? 한 명 이상 찾아 추가합니다.</p>
    <div class="altform"><input type="text" id="s5-exwho" placeholder="이해관계자"><input type="text" id="s5-exwhy" placeholder="왜 목소리를 내기 어려운가"><input type="text" id="s5-extxt" placeholder="예측한 반응과 이유"><button class="btn" data-act="s5exadd">추가</button></div></div>
   <div class="row"><button class="btn primary" data-act="s5seal" ${nIn>=2&&nEx>=1&&fa?"":"disabled"}>예측 확정 · 봉인</button><span class="small">이해관계자 ${nIn}/2명 이상 · 목소리를 내기 어려운 이해관계자 ${nEx}/1명 이상</span></div>`}
   ${gateBox(5,d.sealed,"반응 예측")}</div>`;
  const sc=d.scen;
  const scen=`<div class="block"><h3>시나리오 읽기 메모 <span class="ws">5-3</span> <span class="mins">2'</span></h3><p class="hint">대안이 실행된 뒤 일어날 수 있는 장면을 이야기로 보여 줍니다. 미래를 맞히는 예언이 아니라 가능한 전개 가운데 하나입니다. 이야기 속에서 우리 예측과 다른 점, 문제가 될 만한 장면을 직접 찾아봅시다.</p>
   ${sc?`<div class="stories">${["A","B","C"].map(k=>`<article class="story ${d.pick===k?"sel":""}"><h4><span class="scen-l">시나리오 ${k}</span>${esc(sc[k].title)}</h4>${sc[k].story.map(x=>`<p>${esc(x)}</p>`).join("")}<label class="small" style="display:flex;gap:6px;align-items:center;margin-top:8px;font-weight:600;color:var(--ink)"><input type="radio" name="s5pick" data-act="pick" data-v="${k}" ${d.pick===k?"checked":""} ${chosen?"disabled":""}> 시나리오 ${k}가 가장 개연성 있다</label></article>`).join("")}</div>
   ${S.live?"":`<p class="small">미리 넣은 예시 시나리오입니다. 대안 '인도적 체류 허가의 연장 기간을 늘린다'를 바탕으로 만들었으므로 우리 대안과 맞지 않을 수 있습니다.</p>`}
   <div class="tablewrap" style="margin-top:12px"><table style="min-width:760px"><thead><tr><th>구분</th>${["A","B","C"].map(k=>`<th>시나리오 ${k}</th>`).join("")}</tr></thead><tbody>

function setPath(p,v){const ks=p.split(".");let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]===undefined)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}
function getPath(p){return p.split(".").reduce((o,k)=>o==null?o:o[k],S)}

let tick=null;
function startTimer(sec){S.s1.deadline=Date.now()+sec*1000;if(tick)clearInterval(tick);tick=setInterval(()=>{const el=$("#s1-timer");if(!S.s1.deadline){clearInterval(tick);tick=null;return}if(el){el.textContent=timerText();el.classList.toggle("low",S.s1.deadline-Date.now()<60000)}if(Date.now()>=S.s1.deadline){clearInterval(tick);tick=null;S.s1.deadline=null;if(S.s1.phase===1&&!S.s1.chat.some(m=>m.wait)){S.s1.phase=2;S.s1.chat.push({r:"sys",x:"1차 대화 시간이 끝났습니다. 대화를 멈추고 모둠에서 더 필요한 질문을 합의합니다."});log(1,"seal","1차 대화 종료(시간)");startTimer(60)}render()}},500)}

async function personaReply(qText){
  const d=S.s1;const pre=d.first?PERSONA_PRE:"";d.first=false;
  const msg={r:"ai",x:"",wait:true};d.chat.push(msg);render();
  if(S.live){
    const sample=await getSample();
    if(sample){
      d.turns.push({role:"user",content:qText});
      try{
        const {text}=await sample([{role:"user",content:P_PERSONA()+(pre?"\n이번이 첫 응답이다. 맨 앞에 가상 인물임을 한 문장으로 밝힌다.":"")},...d.turns],{cache:false,modelTier:"quick",onText:({text})=>{msg.x=text;const els=document.querySelectorAll(".msg.ai .thinking");const el=els[els.length-1];if(el)el.textContent=text}});
        d.turns.push({role:"assistant",content:text});msg.x=text;msg.wait=false;log(1,"ai","유수프 응답(실시간)");afterAI(msg);render();return;
      }catch(e){d.turns.pop();d.chat.push({r:"sys",x:liveErr(e)})}
    }else{S.live=false;d.chat.push({r:"sys",x:"이 화면에서는 실시간 응답을 쓸 수 없어 예시 응답으로 답합니다."})}
  }
  msg.x=pre+personaCanned(qText);msg.wait=false;log(1,"ai","유수프 응답");afterAI(msg);render();
}
function afterAI(msg){if(BIAS.test(msg.x))alertAdd(1,"bias","AI 응답에 일반화로 보이는 표현: "+msg.x.slice(0,50),"bias-"+S.s1.chat.indexOf(msg))}
async function searchAsk(i,follow){
  const r=S.s3.rows[i];r.wait=true;r.err="";render();
  if(S.live){
    const sample=await getSample();
    if(sample){
      try{
        if(follow){const {text}=await sample(P_FOLLOW(r.q,r.ans),{modelTier:"default"});r.fu=text}
        else{const o=await sample.json(P_SEARCH(r.q),{modelTier:"default"});r.ans=String(o.answer||"");r.src=Array.isArray(o.sources)?o.sources.map(String):[]}
        r.wait=false;log(3,"ai",(follow?"근거 다시 묻기":"자료 탐색 응답")+`(질문 ${i+1}, 실시간)`);render();return;
      }catch(e){r.err=liveErr(e)}
    }else S.live=false;
  }
  if(follow)r.fu=FOLLOW;else{const o=searchCanned(r.q);r.ans=o.a;r.src=o.src.slice()}
  r.wait=false;log(3,"ai",(follow?"근거 다시 묻기":"자료 탐색 응답")+`(질문 ${i+1})`);render();
}

   case "s1add":{const t=val("s1-new");d1.qType=+$("#s1-type").value;if(!t||d1.qs.length>=5)return;d1.qs.push({t,type:d1.qType,aft:!!helpVis("q1")});break}
   case "s1seal":d1.sealed=true;d1.sealT=now();S.req[1]="";log(1,"seal",`질문 목록 봉인 (${d1.qs.length}개)`);break;
   case "tOpen":S.ai[n]=true;S.req[n]="";log(n,"open",`${n}단계 AI 열기`);if(n===1&&d1.phase===0&&d1.sealed){d1.phase=1;d1.chat.push({r:"sys",x:"선생님이 대화를 열었습니다. 1차 대화는 4분입니다."});startTimer(240)}break;
   case "tReq":S.req[n]=val("req-"+n)||"산출물을 보완해 다시 저장해 봅시다.";log(n,"help",`${n}단계 보완 요청: ${S.req[n]}`);break;
   case "unseal":{({1:d1,3:d3,4:d4,5:d5})[n].sealed=false;S.req[n]="";log(n,"seal",`${n}단계 봉인 해제(보완 요청)`);break}
   case "s1send":case "s1send2":{const two=a==="s1send2";const sel=$(two?"#s1-pick2":"#s1-pick");if(!sel||sel.value==="")return;const q=(two?d1.qs2:d1.qs)[+sel.value];q.sent=true;d1.chat.push({r:"me",x:q.t});log(1,"ai",`질문 보냄: ${q.t}`);personaReply(q.t);return}
   case "s1pause":d1.phase=2;d1.chat.push({r:"sys",x:"대화를 멈췄습니다. 1분 동안 더 필요한 질문을 합의합니다."});log(1,"seal","1차 대화 멈춤");startTimer(60);break;
   case "s1add2":{const t=val("s1-new2");if(!t||d1.qs2.length>=2)return;d1.qs2.push({t});break}
   case "s1seal2":d1.sealed2=true;d1.sealT2=now();log(1,"seal",`추가 질문 봉인 (${d1.qs2.length}개)`);if(d1.qs2.length){d1.phase=3;d1.chat.push({r:"sys",x:"2차 대화를 시작합니다. 2분입니다."});startTimer(120)}else{d1.phase=4;d1.endT=now();d1.deadline=null;log(1,"ai","대화 로그 제출")}break;
   case "s1end":d1.phase=4;d1.endT=now();d1.deadline=null;d1.chat.push({r:"sys",x:"대화를 마쳤습니다. 1·2차 대화 로그가 제출되었습니다."});log(1,"ai","1·2차 대화 로그 제출");break;
   case "report":{const m=d1.chat[i];m.flag=true;d1.halted=true;d1.chat.push({r:"sys",x:"신고한 응답을 표시하고 대화를 멈췄습니다. 선생님께 알림이 갔습니다."});alertAdd(1,"report","이상 응답 신고: "+m.x.replace(PERSONA_PRE,"").slice(0,60),"rep-"+i);log(1,"report","이상 응답 신고");break}
   case "ox":d2.qa[i]=v;break;
   case "cls":{const c=d2.cls[i]||{};d2.cls[i]={v,art:v==="확인된 이야기"?(c.art||""):""};break}
   case "s2g":{const t=val("s2-g");if(!t)return;d2.guesses.push({t});if(BIAS.test(t))alertAdd(2,"bias",`원인 추측에 일반화 표현: "${t}" — 되묻기 필요`,"bias-g-"+t);break}
   case "s2v":{const t=val("s2-v");if(!t||d2.vq.length>=NEED()||d2.vq.some(v=>v.cause===$("#s2-vc").value||v.who===$("#s2-vw").value)||!$("#s2-vc").value||!$("#s2-vw").value){const n=!$("#s2-vc").value?$("#s2-vc"):$("#s2-vw");if(n&&!n.value)n.focus();return}d2.vq.push({q:t,cause:$("#s2-vc").value,who:$("#s2-vw").value,aft:!!helpVis("q2")});break}
   case "s3seal":d3.sealed=true;d3.sealT=now();S.req[3]="";syncRows();log(3,"seal","원인 확인 질문 봉인(2-5)");break;
   case "s3ask":searchAsk(i,false);return;
   case "s3fu":searchAsk(i,true);return;
   case "s3j":d3.rows[i].j=v;break;
   case "s3link":{const x=$("#s3-la").value,y=$("#s3-lb").value;if(!x||!y||x===y)return;d3.links.push([x,y]);break}
   case "s3done":d3.done=true;d3.doneT=now();log(3,"seal","핵심 원인 공유 · 로그 제출");break;
   case "s4pin":d4.pinned=true;d4.pinT=now();log(4,"seal","핵심 원인 고정");break;
   case "s4add":{const t=val("s4-txt");if(!t)return;d4.alts.push({txt:t,actor:$("#s4-actor").value,aft:helpAfter("case")});break}
   case "s4seal":d4.sealed=true;d4.sealT=now();S.req[4]="";log(4,"seal",`대안 봉인 (${d4.alts.length}개)`);break;
   case "s4fb":feedback();return;
   case "s4j":d4.fb[i].j=v;break;
   case "score":d4.fb[i].r[+b.dataset.k]=+v;break;
   case "first":d4.first=i;break;
   case "s5add":{const w=val("s5-who"),t=val("s5-txt");if(!w||!t)return;d5.preds.push({who:w,txt:t,reason:val("s5-rsn"),aft:!!helpVis("who")});break}
   case "s5exadd":{const w=val("s5-exwho"),t=val("s5-extxt");if(!w||!t)return;d5.preds.push({who:w,why:val("s5-exwhy"),txt:t,ex:true,aft:!!helpVis("who")});break}
   case "whoex":{const el=$("#s5-who");if(el){el.value=v;el.focus()}return}
   case "s5seal":d5.sealed=true;d5.sealT=now();S.req[5]="";log(5,"seal","반응 예측 봉인");break;
   case "s5gen":scenarios();return;
   case "pick":d5.pick=v;break;
   case "s5why":if(d5.why.trim().length<20)return;d5.whySaved=true;d5.whyT=now();log(5,"seal",`시나리오 ${d5.pick} 선택 저장`);break;
   case "s5edit":d5.whySaved=false;break;
   case "set":setPath(b.dataset.k,v);break;
   case "tog":{const arr=getPath(b.dataset.k);const k=arr.indexOf(v);if(k>=0)arr.splice(k,1);else arr.push(v);break}
   case "s6addplan":d6.plans.push({target:"",content:"",how:"",channel:""});break;
   case "s6res":d6.resOpen=true;break;
   case "t6ok":d6.tok=true;d6.tokT=now();d6.tnote=val("t6-note");log(6,"open","제출 전 교사 확인");break;
   case "copy":{const txt="[3모둠] 우리는 왜 여기 왔을까: 제주의 예멘 난민\n"+fullChain().map(([k,x])=>`${k}: ${x||"-"}`).join("\n");S.s7.posted=true;const note=m=>{const n0=$("#copy-note");if(n0)n0.textContent=m};try{navigator.clipboard.writeText(txt).then(()=>note("복사했습니다. 공유 게시판에 붙여 넣으세요."),()=>note("복사가 막혔습니다. 위 흐름을 직접 선택해 복사하세요."))}catch(err){note("복사가 막혔습니다. 위 흐름을 직접 선택해 복사하세요.")}return}
   case "peerpick":{const p=S.s7.peers;const k=p.indexOf(v);if(k>=0)p.splice(k,1);else if(p.length<2)p.push(v);break}
   case "peer":{const g=b.dataset.g;S.s7.peer[g]=S.s7.peer[g]||[0,0,0,0];S.s7.peer[g][+b.dataset.k]=+v;break}
   case "refl":S.s7.chk[i]=v;break;
   case "openTo":S.open=n;log(n,"open",`${n}단계까지 개방`);break;
   case "help":{const r=S.rev[b.dataset.k],m=b.dataset.m,h=HELP.find(x=>x.k===b.dataset.k);if(m==="hide"){if(h.seq){r.all=0;r.g=0}else{r.all=false;r.g=false}}else if(m==="all")r.all=true;else r.g=true;r.t=now();log(h.stage,"help",`${h.name} ${m==="hide"?"숨김":m==="all"?"전체 공개":"3모둠 공개"}`);break}
   case "case":{const r=S.rev.case;if(b.dataset.m==="all")r.all=Math.min(CASES.length,r.all+1);else r.g=Math.min(CASES.length,Math.max(r.all,r.g)+1);r.t=now();log(4,"help",`유사 사례 공개: 3모둠 ${Math.max(r.all,r.g)}건`);break}
   case "aDone":{const al=S.alerts.find(x=>x.id===i);al.done=true;al.res=v;if(b.dataset.resume){d1.halted=false;d1.chat.push({r:"sys",x:"선생님이 확인했습니다. 대화를 이어 갑니다."})}log(al.stage,"open","알림 처리: "+v);break}
   case "fillAll":fillAll();break;
  }
  render();
});
app.addEventListener("input",e=>{
  const el=e.target,p=el.dataset.bind;if(!p||el.type==="checkbox"||el.type==="radio")return;
  setPath(p,el.value);
  if(el.dataset.red){let key=el.dataset.red,v=el.value;if(key==="s3-coreC"||key==="s3-coreE"){key="s3-core";v=S.s3.coreC+" "+S.s3.coreE}
    const box=document.getElementById("rb-"+key);if(box)box.outerHTML=redHtml(key,v);checkRed(key,v,+el.dataset.st)}
  if(p==="s5.why"){const c=$("#s5-whycnt"),btn=$("#s5-whybtn");if(c)c.textContent=S.s5.why.trim().length+"자 · 20자 미만이면 저장되지 않습니다.";if(btn)btn.disabled=!(S.s5.pick&&S.s5.why.trim().length>=20)}
  if(el.dataset.chk6||p.startsWith("s6.prop")){const box=$("#s6-auto");if(box)box.innerHTML=autoChk6()}
});
app.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="s1-type"){S.s1.qType=+el.value;return}
  const p=el.dataset.bind;if(!p)return;
  setPath(p,el.type==="checkbox"?el.checked:el.value);
  if(el.dataset.chk6||p.startsWith("s6.prop")){const t=autoChk6();if(/개인정보/.test(t))alertAdd(6,"pi","행동계획에 개인정보로 보이는 내용","pi6");if(/일반화/.test(t))alertAdd(6,"bias","행동계획에 일반화로 보이는 표현","bias6")}
  if(el.tagName==="SELECT"||el.type==="checkbox")render();
  else if(["s4.coreEdit","s4.improve","s5.newp","s7.r1"].includes(p)||/^s3\.rows\.\d+\.(sum|res)|^s4\.fb\.\d+\.(sum|why|rw)|^s3\.core/.test(p))softRender();
});
app.addEventListener("paste",e=>{const el=e.target;if(el.dataset&&el.dataset.red){let id=el.dataset.red;if(id==="s3-coreC"||id==="s3-coreE")id="s3-core";const st=+el.dataset.st;setTimeout(()=>{alertAdd(st,"paste",`${fieldName(id)}에 붙여넣기`,"paste-"+id+"-"+S.alerts.length);log(st,"red","붙여넣기 감지: "+fieldName(id))},0)}});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){const m={"s1-new":"s1add","s1-new2":"s1add2","s2-g":"s2g","s2-v":"s2v","s4-txt":"s4add","s4-cause":"s4add","s5-txt":"s5add","s5-rsn":"s5add","s5-extxt":"s5exadd"}[e.target.id];if(m){e.preventDefault();const btn=document.querySelector(`[data-act="${m}"]`);if(btn)btn.click()}}});

render();
