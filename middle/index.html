<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI-EPS 전자 쓰레기 수업 견본</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 앱 셸(상단 바 + 보기 전환) 아래, 학생 보기는 단계 레일 + 작업 패널 2열. 좁은 화면에서는 레일이 가로 띠가 된다 */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EDEB; --ink:#17201E; --muted:#58665F; --line:#D5DDDA;
  --accent:#1E5D55; --accent-ink:#FFFFFF; --accent-soft:#DDECE9;
  --g:#2D7F4F; --g-bg:#E0F1E6; --y:#9A6A00; --y-solid:#D99A0B; --y-bg:#FFF2D2; --r:#B8342B; --r-bg:#FBE2DF; --off:#6E7B78; --off-bg:#E6EAE9;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#18201E; --sunk:#141B19; --ink:#E4EBE9; --muted:#9AA9A4; --line:#2B3633;
  --accent:#6CC2B5; --accent-ink:#0E1A18; --accent-soft:#1D3431;
  --g:#6BCB92; --g-bg:#173325; --y:#F0BE4C; --y-solid:#E5A824; --y-bg:#352A10; --r:#F2867C; --r-bg:#3C1C19; --off:#93A19D; --off-bg:#222B29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201E; --sunk:#141B19; --ink:#E4EBE9; --muted:#9AA9A4; --line:#2B3633;
  --accent:#6CC2B5; --accent-ink:#0E1A18; --accent-soft:#1D3431;
  --g:#6BCB92; --g-bg:#173325; --y:#F0BE4C; --y-solid:#E5A824; --y-bg:#352A10; --r:#F2867C; --r-bg:#3C1C19; --off:#93A19D; --off-bg:#222B29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand b{font-size:19px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
.views{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.views button{border:0;background:transparent;color:var(--muted);font:600 14px var(--sans);padding:7px 14px;border-radius:7px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.demo-note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:3px 8px}
main{max-width:1240px;margin:0 auto;padding-block:20px 60px}
button{font-family:var(--sans)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.student{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:6px}
.rail .who{font-size:13px;color:var(--muted);padding:0 4px 6px}
.step{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.step .n{grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--sunk);color:var(--muted)}
.step .t{font-weight:600;font-size:14px;line-height:1.35}
.step .s{font-size:12px;color:var(--muted)}
.step[aria-current="step"]{background:var(--surface);border-color:var(--line)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--accent-soft);color:var(--accent)}
.step:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.Y{background:var(--y-bg);color:var(--y)} .chip.N{background:var(--off-bg);color:var(--off)} .chip.R{background:var(--r-bg);color:var(--r)} .chip.G{background:var(--g-bg);color:var(--g)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,28px);min-width:0}
.stage-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.stage-head h2{margin:0;font-size:22px;text-wrap:balance}
.stage-def{color:var(--muted);margin:0 0 16px;max-width:68ch}
.signal{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.signal.Y{background:var(--y-bg)} .signal.N{background:var(--off-bg)}
.signal strong{display:block}
.signal .lamp{flex:none;display:flex;flex-direction:column;gap:3px;padding:4px;border-radius:6px;background:#1c2422}
.lamp i{width:9px;height:9px;border-radius:50%;background:#3b4542;display:block}
.signal.Y .lamp i:nth-child(2){background:#F2B32A}

.flow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;list-style:none;padding:0}
.flow li{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:flex;gap:6px;align-items:center}
.flow li.now{border-color:var(--accent);color:var(--accent);font-weight:600}
.flow li.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.flow li.lock::after{content:"잠김";font-size:11px;color:var(--muted)}

.block{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.block.first{border:0;margin:0;padding:0}
.block h3{font-size:16px;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.block .hint{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:70ch}
.ws{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.locked>.lockbody{opacity:.38;pointer-events:none;user-select:none}
.lockmsg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.lockmsg::before{content:"";width:12px;height:12px;border:2px solid currentColor;border-radius:3px}

.letter{background:var(--sunk);border-radius:12px;padding:16px 18px;font-size:14.5px;max-width:70ch}
.letter p{margin:0 0 8px}
.letter p:last-child{margin:0}
.letter .from{font-size:12.5px;color:var(--muted);margin-bottom:6px}

.list{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:14px}
.list li .tag{flex:none;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px}
.list li .txt{flex:1;min-width:0}
.list li .x{flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input,.addrow select{flex:1 1 180px;min-width:0}
input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
textarea[readonly]{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{border-color:var(--r);color:var(--r)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seal{font:500 12px var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.small{font-size:12.5px;color:var(--muted)}
.timer{font:600 13px var(--mono);padding:3px 9px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.timer.low{background:var(--y-bg);color:var(--y)}

.chat{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:12px;padding:14px;max-height:380px;overflow:auto;margin-bottom:10px}
.msg{max-width:78%;padding:9px 13px;border-radius:12px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px;user-select:none}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;padding:2px}
.msg .who{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.persona{display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:13.5px}
.persona .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.persona em{font-style:normal;color:var(--muted);display:block;font-size:12.5px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td select,td input[type=text],td textarea{font-size:13px;padding:5px 7px}
td textarea{min-height:56px}
.ai-ans{user-select:none}
.ai-ans small{display:block;color:var(--muted);margin-top:3px}
.checks{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.checks label{display:flex;gap:5px;align-items:center;white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:6px}
.fact{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fact .big{font:600 24px var(--sans);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.fact .src{font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:4px}
.fact p{margin:0;font-size:13.5px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);user-select:none}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card h4{margin:0;font-size:15px}
.card dl{margin:0;display:grid;gap:6px;font-size:13px}
.card dt{font-weight:600;color:var(--muted);font-size:12px}
.card dd{margin:0}
.scen-l{font:600 12px var(--mono);color:var(--accent);letter-spacing:.04em}
.cards.stories{grid-template-columns:minmax(0,1fr)}
.cards.stories .card{max-width:78ch}
.card.story p{margin:0;font-size:13.5px;line-height:1.7}
.card label{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;margin-top:auto}

.redbox{margin-top:8px;border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.redbox.ok{background:var(--g-bg);color:var(--g)}
.redbox.warn{background:var(--y-bg);color:var(--y)}
.redbox.red{background:var(--r-bg);color:var(--r)}
.meter{flex:1 1 120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:currentColor}
.redbox b{font-family:var(--mono)}

.qa{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:q}
.qa li{counter-increment:q;display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.qa-q{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.qa-q::before{content:counter(q);font:600 12px var(--mono);color:var(--muted)}
.qa-type{font:600 11px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
.ox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ox button{width:44px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--mono);cursor:pointer}
.ox button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qa-fb{font-size:13px;padding:3px 8px;border-radius:6px}
.qa-fb.ok{background:var(--g-bg);color:var(--g)} .qa-fb.no{background:var(--y-bg);color:var(--y)}
.fiction{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.fiction ul{margin:8px 0 0;padding-left:18px}
.fiction li{margin-bottom:3px}
.fic-tag{font:600 11px var(--mono);color:var(--off);background:var(--off-bg);border-radius:4px;padding:1px 6px;margin-right:6px}
.life{display:flex;flex-direction:column;gap:12px}
.life section{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.life section>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.life-n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--mono)}
.pend{display:flex;flex-direction:column;gap:2px;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.pend b{color:var(--ink);font-size:13.5px}
.exbox{background:var(--y-bg);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:13.5px}
.exbox ul{margin:6px 0 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.exq{border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:12px}
.altform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.5fr) minmax(0,1.2fr) auto;gap:8px}
.casegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.casegrid .fact input{margin-bottom:4px}
.corebox{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14.5px}
.simwarn{display:inline-block;margin-top:3px;font-size:12.5px;color:var(--y);background:var(--y-bg);border-radius:5px;padding:1px 7px}
.demo-btn{margin-left:auto;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.log .k-rev{color:var(--g)}
@media (max-width:860px){.altform{grid-template-columns:minmax(0,1fr)}}
.nextbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);margin-top:20px;padding-top:14px}
.demo-hint{border:1px dashed var(--line);border-radius:6px;padding:2px 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acttypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.acttypes div{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px}
.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.scope{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.scope .small{grid-column:2}
.scope.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.propform{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pf{display:grid;grid-template-columns:130px minmax(0,1fr);border-bottom:1px solid var(--line);font-size:14px}
.pf:last-child{border-bottom:0}
.pf-k{background:var(--sunk);padding:10px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.pf>div{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pf-src{font:500 11px var(--mono);color:var(--accent);margin-top:2px}
.pf-ul{margin:0;padding-left:18px}
@media (max-width:860px){.pf{grid-template-columns:minmax(0,1fr)}}
.chain{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.chain li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.chain li:last-child{border:0}
.chain li span:first-child{color:var(--muted);font-size:12.5px;font-weight:600}
.scale td,.scale th{text-align:center}
.scale td:nth-child(2),.scale th:nth-child(2){text-align:left}

.teacher{display:grid;gap:18px}
.tgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.sec-title{font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.gates{display:flex;gap:6px;flex-wrap:wrap}
.gates button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.gates button.open{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.cell{display:inline-block;width:22px;height:22px;border-radius:5px;font:500 11px/22px var(--mono);text-align:center}
.cell.d{background:var(--accent-soft);color:var(--accent)} .cell.w{background:var(--sunk);color:var(--muted)} .cell.f{background:var(--r-bg);color:var(--r)} .cell.p{background:var(--y-bg);color:var(--y)}
.flags{display:flex;flex-direction:column;gap:8px}
.flag{border-left:3px solid var(--r);background:var(--r-bg);border-radius:0 8px 8px 0;padding:9px 12px;font-size:13.5px}
.flag.y{border-color:var(--y-solid);background:var(--y-bg)}
.flag b{display:block}
.log{font:13px/1.55 var(--mono);display:flex;flex-direction:column;gap:2px;max-height:360px;overflow:auto}
.log div{display:grid;grid-template-columns:52px 34px 1fr;gap:8px;padding:4px 6px;border-radius:5px}
.log div:nth-child(odd){background:var(--sunk)}
.log .k-seal{color:var(--accent)} .log .k-ai{color:var(--y)} .log .k-red{color:var(--r)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:8px}

.plan{display:grid;gap:18px}

function log(stage,kind,text){S.logs.push({t:now(),stage,kind,text})}
function aiTexts(){

}
/* Red 탐지: 학생 문장의 글자 3-gram 가운데 같은 모둠 AI 응답에 이미 있는 비율 */
function grams(s){s=s.replace(/[\s.,!?·'"“”‘’()\-]/g,"");const g=new Set();for(let i=0;i+3<=s.length;i++)g.add(s.slice(i,i+3));return g}
function overlap(txt){const a=grams(txt);if(a.size<6)return null;let best=0;aiTexts().forEach(t=>{const b=grams(t);let h=0;a.forEach(x=>{if(b.has(x))h++});best=Math.max(best,h/a.size)});return best}
function redHtml(id,val){
  const v=overlap(val||"");
  if(v===null)return `<div class="redbox ok" id="${id}-rb">재구성 점검: 문장을 더 쓰면 AI 응답과 겹치는 정도를 확인합니다.</div>`;
  const p=Math.round(v*100),cls=v>=.6?"red":v>=.35?"warn":"ok";
  const msg=v>=.6?"Red 의심 · AI 응답을 그대로 옮긴 것으로 보입니다. 선생님께 알림이 가고, 말로 설명하기 전까지 인정되지 않습니다.":v>=.35?"주의 · AI 표현이 많이 남아 있습니다. 우리 말로 다시 써 보세요.":"재구성 확인 · 우리 말로 쓴 문장입니다.";
  return `<div class="redbox ${cls}" id="${id}-rb"><span>${msg}</span><span class="meter"><i style="width:${p}%"></i></span><b>${p}%</b></div>`;
}
const flagged=new Set();
function bindRed(el,id,stage,set){
  if(!el)return;
  const upd=()=>{set(el.value);const b=document.getElementById(id+"-rb");if(b)b.outerHTML=redHtml(id,el.value);
    const v=overlap(el.value);if(v!==null&&v>=.6&&!flagged.has(id)){flagged.add(id);log(stage,"red","Red 의심("+id+"): AI 응답 일치율 "+Math.round(v*100)+"%")}};
  el.addEventListener("input",upd);
  el.addEventListener("paste",()=>setTimeout(()=>log(stage,"red","붙여넣기 감지 ("+id+")"),0));
}

const PEER=["문제의 원인을 타당하게 판단했다.","신뢰할 수 있는 근거를 활용했다.","해결 대안이 실현 가능하다.","대안으로 나타날 결과를 충분히 고려했다."];

/* ---- helpers ---- */
const flowList=items=>`<ol class="flow">${items.map(([t,st])=>`<li class="${st}">${esc(t)}</li>`).join("")}</ol>`;
const lockWrap=(on,msg,inner)=>on?`<div class="locked"><div class="lockmsg">${esc(msg)}</div><div class="lockbody">${inner}</div></div>`:inner;
function listItems(arr,tag,removable,key){return `<ul class="list">${arr.map((x,i)=>`<li>${tag?`<span class="tag">${esc(tag(i,x))}</span>`:""}<span class="txt">${esc(typeof x==="string"?x:x.txt)}${x&&x.why?`<br><span class="small">목소리를 내기 어려운 이유: ${esc(x.why)}</span>`:""}</span>${removable?`<button class="x" data-del="${key}" data-i="${i}">삭제</button>`:""}</li>`).join("")}</ul>`}
function signal(g){return g==="Y"
 ?`<div class="signal Y"><span class="lamp" aria-hidden="true"><i></i><i></i><i></i></span><div><strong>YELLOW · 먼저 우리가 생각하고, 그다음에 AI</strong>모둠이 먼저 쓰고 합의한 내용을 저장해야 AI 창이 열립니다. AI의 답은 그대로 옮기지 않고 우리 말로 바꿔 판단합니다. 이 단계의 대화는 모두 기록되어 제출됩니다.</div></div>`
 :`<div class="signal N"><span class="lamp" aria-hidden="true"><i></i><i></i><i></i></span><div><strong>AI 미사용 단계</strong>이 단계는 모둠이 직접 생각하고 토의합니다. 화면에 AI 창이 없습니다.</div></div>`}
function stageDone(n){switch(n){
 case 1:return S.s1.sealed2&&S.s1.asked2.length===S.s1.qs2.length;
 case 2:return S.s2.vq.length===2;
 case 3:return S.s3.core.trim().length>10;
 case 4:return S.s4.first!==null&&S.s4.firstWhy.trim().length>10;
 case 5:return S.s5.newp.trim().length>10;
 case 6:return !!S.s6.scope&&S.s6.plans.some(p=>p.who&&p.how);
 case 7:return S.s7.chk.every(x=>x);
 }return false}

let busy=false,pending=false;
function render(){
  if(busy){pending=true;return}
  busy=true;
  try{
    document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",String(b.id==="v-"+S.view)));
    $("#app").innerHTML=S.view==="student"?renderStudent():S.view==="teacher"?renderTeacher():renderPlan();
    bind();
  }finally{busy=false}
  if(pending){pending=false;setTimeout(render,0)}
}
function renderStudent(){
  const rail=`<nav class="rail" aria-label="수업 단계"><div class="who">3모둠 · 서윤 · 중3 · 90분 연차시</div>${STAGES.map(st=>{const dis=st.n>S.open;
   return `<button class="step ${stageDone(st.n)?"done":""}" data-stage="${st.n}" ${dis?"disabled":""} ${S.stage===st.n?'aria-current="step"':""}><span class="n">${st.n}</span><span class="t">${esc(st.t)}</span><span class="s">${dis?"선생님이 아직 열지 않음":`<span class="chip ${st.g}">${st.g==="Y"?"YELLOW":"AI 없음"}</span>`}</span></button>`}).join("")}</nav>`;
  const st=STAGES[S.stage-1];
  const head=`<div class="stage-head"><h2>${st.n}단계 · ${esc(st.t)}</h2><span class="chip ${st.g}">${st.g==="Y"?"YELLOW":"AI 미사용"}</span><span class="ws">${esc(st.ws)}</span>${st.role?`<span class="small">AI 역할: ${esc(st.role)}</span>`:""}${DEMO[st.n]?`<button class="demo-btn" data-demo="${st.n}">시연용 예시 넣기</button>`:""}</div><p class="stage-def">${esc(st.def)}</p>${signal(st.g)}`;
  const nx=S.stage+1;
  const next=nx>7?"":nx<=S.open?`<div class="nextbar"><button class="btn primary" data-stage="${nx}">${nx}단계로 이동</button></div>`:`<div class="nextbar"><span class="small">${nx}단계는 선생님이 아직 열지 않았습니다. 선생님이 열면 이동할 수 있습니다.</span><span class="small demo-hint">시연: 교사 화면 → 단계 개방에서 ${nx}을 누르세요.</span></div>`;
  return `<div class="student">${rail}<section class="panel">${head}${[null,s1,s2,s3,s4,s5,s6,s7][S.stage]()}${next}</section></div>`;
}

function timerText(){if(!S.s1.deadline)return "10:00";const r=Math.max(0,Math.round((S.s1.deadline-Date.now())/1000));return String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")}

function s1(){
  const d=S.s1,phase=!d.sealed?0:!d.paused?1:!d.sealed2?2:3;
  const fl=flowList([["편지 읽기","ok"],["① 질문 합의",phase>0?"ok":"now"],["② 1차 대화",phase===1?"now":phase>1?"ok":"lock"],["③ 멈추고 논의",phase===2?"now":phase>2?"ok":"lock"],["④ 2차 대화",phase===3?"now":"lock"]]);
  const letter=`<div class="block first"><h3>코피에게서 온 편지</h3><div class="letter"><div class="from">가상 인물 · 실제 사건을 모티프로 선생님이 AI를 활용해 창작한 편지입니다.</div>
   <p>안녕. 나는 서아프리카에 사는 코피라고 해.</p>
   <p>내가 사는 곳에는 푸른 나무와 들판이 있는 아름다운 마을이야. 그런데 요즘 마을 근처에 오래된 컴퓨터, 휴대전화, 모니터, 전선 같은 전자제품 폐기물이 많이 쌓이고 있어. 사람들은 그 안에서 쓸 수 있는 부품과 금속을 찾기 위해 전자제품을 부수거나 태우기도 해. 그럴 때면 검은 연기가 나고, 비가 온 뒤에는 폐기물이 쌓인 곳에서 흘러나온 물이 주변 땅과 물길로 퍼지기도 해. 우리 마을이 점점 달라지는 것 같아 걱정돼.</p>
   <p>이렇게나 많은 전자 쓰레기들이 왜 우리 동네까지 오게 되었는지 모르겠어. 너희도 휴대전화나 이어폰, 태블릿 같은 전자제품을 사용하지? 사용할 땐 정말 편하지만, 그것을 사용하지 않게 되었을 때 어디로 가는지 생각해 본 적 있어?</p>
   <p>우리가 필요한 전자제품도 사용하고, 환경도 지킬 수 있는 좋은 방법은 없을까?</p></div></div>`;
  const q1=`<div class="block"><h3>① 코피에게 물어볼 질문 합의 ${d.sealed?`<span class="seal">봉인 ${esc(d.sealTime)}</span>`:""}</h3>
   <p class="hint">코피가 어떤 어려움을 겪는지 알 수 있도록 모둠이 토의해 질문을 정합니다. 3개 이상이어야 대화를 시작할 수 있습니다.</p>
   ${listItems(d.qs,i=>"Q"+(i+1)+aft("q1",d.qs[i]),!d.sealed,"s1qs")}
   ${d.sealed?"":`<div class="addrow"><input type="text" id="s1-new" placeholder="모둠이 직접 만든 질문"><button class="btn" data-act="s1add">추가</button></div>
   ${vis("q1")?`<div class="exbox"><b class="small">선생님이 공개한 예시 질문</b> <span class="small">그대로 쓰기보다 우리가 더 알고 싶은 것으로 바꿔 봅시다.</span><ul>${Object.keys(KOFI).map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>`:pendingBox("q1","예시 질문")}
   <div class="row"><button class="btn primary" data-act="s1seal" ${d.qs.length<3?"disabled":""}>합의 완료 · 대화 시작</button><span class="small">${d.qs.length}/3개 이상 · 합의 후에는 고칠 수 없고 시각이 기록됩니다.</span></div>`}</div>`;

   <div class="chat" aria-live="polite">${d.chat.length?d.chat.map(m=>m.r==="sys"?`<div class="msg sys">${esc(m.x)}</div>`:`<div class="msg ${m.r==="me"?"me":"ai"}">${m.r==="ai"?'<span class="who">코피</span>':""}${esc(m.x)}</div>`).join(""):'<div class="msg sys">합의한 질문을 골라 보내면 대화가 시작됩니다.</div>'}</div>`;
  const r1=d.qs.filter(q=>!d.asked.includes(q));

   ${!d.paused?`<div class="addrow"><select id="s1-pick">${r1.map(q=>`<option>${esc(q)}</option>`).join("")}</select><button class="btn primary" data-act="s1send" ${r1.length?"":"disabled"}>보내기</button></div>

   ${listItems(d.qs2,i=>"추가 "+(i+1),!d.sealed2,"s1qs2")}

   <div class="life">
    <section><span class="life-n">1</span><div><b>같은 청소년</b><label class="small" for="s2-same">코피와 나는 어떤 점이 비슷할까요? 학교, 가족, 친구, 하루 일과, 휴대전화 같은 것을 떠올려 봅니다.</label><textarea id="s2-same" placeholder="예: 코피도 나처럼 가족과 함께 살고 …">${esc(L.same)}</textarea></div></section>
    <section><span class="life-n">2</span><div><b>사는 곳만 다르다면</b><label class="small" for="s2-place">내가 코피의 마을에서 태어났다면 어떤 일을 겪었을까요? 지금의 나는 왜 그 일을 겪지 않을까요? 내가 더 노력해서일까요, 사는 곳이 달라서일까요?</label><textarea id="s2-place">${esc(L.place)}</textarea></div></section>
    <section><span class="life-n">3</span><div><b>나와 코피는 연결되어 있을까</b><span class="small" style="display:block">최근 몇 년 동안 내가 바꾼 전자제품은 어떻게 되었나요?</span>
     <div class="tablewrap" style="margin:6px 0 8px"><table style="min-width:360px"><thead><tr><th>전자제품</th><th>쓰지 않게 된 뒤</th></tr></thead><tbody>${L.dev.map((x,i)=>`<tr><td>${esc(x.item)}</td><td><select data-dev="${i}" aria-label="${esc(x.item)} 처리 방법"><option value="">선택</option>${["아직 쓰는 중","서랍에 보관","일반 쓰레기로 버림","수거함·매장에 반납","팔거나 물려줌","모름"].map(o=>`<option ${x.how===o?"selected":""}>${o}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
     <label class="small" for="s2-impact">내가 쓰다 버린 전자제품과 내 선택이 코피의 삶에 영향을 미쳤을 가능성은 없을까요? 어떤 경로로 연결될 수 있을지 써 봅니다.</label><textarea id="s2-impact">${esc(L.impact)}</textarea>
     <p class="small" style="margin:6px 0 0">확실하지 않은 부분은 단정하지 말고, 아래 원인 탐색 질문으로 남겨 3단계에서 확인합니다.</p></div></section>
   </div></div>`;
  const cmp=qa+diff+life;
  const brain=`<div class="block"><h3>문제 원인 브레인스토밍 <span class="ws">3번</span></h3><p class="hint">전자 쓰레기는 왜 코피의 마을까지 가게 되었을까요? 서로의 의견을 판단하지 않고 모두 적습니다.</p>${listItems(d.causes,null,true,"s2causes")}<div class="addrow"><input type="text" id="s2-c" placeholder="생각나는 원인"><button class="btn" data-act="s2c">추가</button></div></div>`;
  const vq=`<div class="block"><h3>원인 탐색 질문 목록 (모둠당 2개)</h3><p class="hint">개인의 노력만으로 해결될 수 없다면, 어떤 제도나 여론이 영향을 주었을까요? 3단계에서 AI에게 물을 수 있는 질문은 이 두 개뿐입니다.</p>${listItems(d.vq,i=>"질문 "+(i+1)+aft("q2",d.vq[i]),true,"s2vq")}
   ${d.vq.length<2?`<div class="addrow"><input type="text" id="s2-v" placeholder="원인을 확인할 질문"><button class="btn" data-act="s2v">추가</button></div>`:'<p class="small">질문 2개가 정해졌습니다. 바꾸려면 하나를 삭제하세요.</p>'}
   ${vis("q2")?`<div class="exbox"><b class="small">선생님이 공개한 원인 탐색 질문 예시</b> <span class="small">우리가 브레인스토밍한 원인에 맞게 바꿔 씁니다.</span><ul>${Q2_EX.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>`:pendingBox("q2","원인 탐색 질문 예시")}</div>`;
  return facts+cmp+brain+vq;
}

function s3(){
  const d=S.s3;
  if(d.rows.length!==S.s2.vq.length||d.rows.some((r,i)=>r.q!==S.s2.vq[i]))d.rows=S.s2.vq.map((q,i)=>({q,who:MEMBERS.slice(i*2,i*2+2).join("·"),ans:null,src:"",c:[false,false,false],judge:""}));
  const asked=d.rows.length&&d.rows.every(r=>r.ans),judged=asked&&d.rows.every(r=>r.judge&&r.src.trim()&&r.c.some(Boolean));
  const fl=flowList([["① 질문 확인(2단계)","ok"],["② 두 명씩 AI로 자료 찾기",asked?"ok":"now"],["③ 기준으로 검증",asked?(judged?"ok":"now"):"lock"],["④ 핵심 원인",judged?"now":"lock"]]);
  const tbl=`<div class="block"><h3>질문 목록 검증하기 <span class="ws">4번</span></h3><p class="hint">질문 입력창은 없습니다. 2단계에서 만든 질문만 AI에게 보낼 수 있습니다. AI가 말한 출처는 직접 찾아 확인하기 전까지 믿지 않습니다.</p>
   <div class="tablewrap"><table><thead><tr><th>질문 · 담당</th><th>AI를 통해 수집한 자료</th><th>직접 확인한 자료 · 출처</th><th>검증 기준</th><th>채택 여부</th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr>
    <td>${esc(r.q)}<br><span class="small">${esc(r.who)}</span></td>
    <td>${r.ans?`<div class="ai-ans">${esc(r.ans)}<small>AI 제시 출처는 확인 전</small></div>`:`<button class="btn" data-ask3="${i}">AI에게 질의</button>`}</td>
    <td><input type="text" data-src3="${i}" value="${esc(r.src)}" placeholder="기관·문서명, 날짜" ${r.ans?"":"disabled"}></td>
    <td><div class="checks">${["출처를 믿을 수 있다","내용이 직접 확인한 자료와 일치한다","최근 자료다"].map((c,k)=>`<label><input type="checkbox" data-c3="${i}" data-k="${k}" ${r.c[k]?"checked":""} ${r.ans?"":"disabled"}> ${c}</label>`).join("")}</div></td>
    <td><select data-j3="${i}" ${r.ans?"":"disabled"}><option value="">선택</option>${["수용","보류","기각"].map(o=>`<option ${r.judge===o?"selected":""}>${o}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div></div>`;
  const core=`<div class="block"><h3>핵심 원인 도출하기 <span class="ws">5번</span></h3><p class="hint">수용한 자료만 근거로, 이것이 해결되면 다른 원인도 함께 풀리는 원인을 우리 말로 씁니다.</p><textarea id="s3-core" placeholder="핵심 원인과 근거">${esc(d.core)}</textarea>${redHtml("s3-core",d.core)}</div>`;
  if(!d.rows.length)return fl+`<div class="pend"><b>검증할 질문이 없습니다</b><span>2단계에서 원인 탐색 질문 2개를 먼저 만드세요.</span></div>`;
  return fl+tbl+lockWrap(!judged,"두 질문 모두 직접 확인한 자료, 검증 기준, 채택 여부를 적어야 열립니다.",core);
}

function s4(){
  const d=S.s4;
  if(d.notes.length!==CASES.length)d.notes=CASES.map(()=>({changed:"",cant:""}));
  const ready=d.alts.length>=3&&d.alts.every(a=>a.cause.trim());
  const judged=d.fb&&d.fb.every(f=>f.dec&&f.why.trim()&&f.fix.trim());
  const rated=judged&&d.fb.every(f=>f.r[0]&&f.r[1]&&f.r[2]&&f.rw.trim());
  const fl=flowList([["① 핵심 원인 확인","ok"],["② 우리 대안 구상",d.sealed?"ok":"now"],["③ AI 피드백 판단",d.sealed?(judged?"ok":"now"):"lock"],["④ 비교표",judged?(rated?"ok":"now"):"lock"],["⑤ 1순위 직접 선정",rated?"now":"lock"]]);
  const core=`<div class="block first"><h3>우리가 찾은 핵심 원인 <span class="small">3단계</span></h3><div class="corebox">${S.s3.core.trim()?esc(S.s3.core):'<span class="small">3단계에서 핵심 원인을 아직 정하지 않았습니다.</span>'}</div><p class="hint" style="margin-top:8px">이 원인을 바꾸려면 무엇이 달라져야 할까요? 대안은 이 원인을 겨냥해야 합니다.</p></div>`;
  const list=`<ul class="list">${d.alts.map((a,i)=>{const sim=overlapWith(a.txt,caseTexts());return `<li><span class="tag">${esc(TSHORT[a.type])}${aft("alt4",a.txt)}</span><span class="txt">${esc(a.txt)}<br><span class="small">겨냥하는 원인: ${esc(a.cause||"(비어 있음)")}</span>${sim>=.4?`<br><span class="simwarn">사례·예시와 표현이 많이 겹칩니다 (${Math.round(sim*100)}%). 우리 원인과 상황에 맞게 바꿨나요?</span>`:""}</span>${d.sealed?"":`<button class="x" data-del="s4alts" data-i="${i}">삭제</button>`}</li>`}).join("")}</ul>`;
  const add=d.sealed?"":`<div class="altform"><input type="text" id="s4-txt" placeholder="우리 모둠이 생각한 대안"><input type="text" id="s4-cause" placeholder="이 대안이 겨냥하는 원인"><select id="s4-type" aria-label="실행 주체">${TYPES.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join("")}</select><button class="btn" data-act="s4add">추가</button></div>
   <div class="row"><button class="btn primary" data-act="s4seal" ${ready?"":"disabled"}>대안 확정 · AI 피드백 받기</button><span class="small">${d.alts.length}/3개 이상 · 모든 대안에 겨냥하는 원인을 적어야 합니다. 실행 주체가 같은 대안이 여러 개여도 됩니다.</span></div>`;
  const altBlock=`<div class="block"><h3>해결 대안 구상 <span class="ws">나 · 1번</span> ${d.sealed?`<span class="seal">봉인 ${esc(d.sealTime)}</span>`:""}</h3><p class="hint">AI 없이 모둠이 토의합니다. 서로의 의견은 판단하지 않고, 대안마다 겨냥하는 원인과 실행 주체를 함께 적습니다.</p>${list}${add}</div>`;
  const helps=`<div class="block"><h3>도움 자료 <span class="small">선생님이 공개</span></h3>
   ${vis("cases")?`<p class="hint">해결책을 고르는 자료가 아닙니다. 각 사례가 무엇을 바꿨는지 찾고, 우리 상황에 그대로 쓸 수 없는 이유를 적어 봅시다.</p><div class="casegrid">${CASES.map((c,i)=>`<div class="fact"><p><b>${esc(c[0])}</b></p><p>${esc(c[1])}</p><span class="src">생각해 볼 점: ${esc(c[2])}</span>
     <label class="small" for="s4-ch${i}">이 사례가 바꾼 것은?</label><input type="text" id="s4-ch${i}" data-note="${i}" data-k="changed" value="${esc(d.notes[i].changed)}">
     <label class="small" for="s4-ct${i}">우리 상황에 그대로 쓸 수 없는 이유는?</label><input type="text" id="s4-ct${i}" data-note="${i}" data-k="cant" value="${esc(d.notes[i].cant)}"></div>`).join("")}</div>`:pendingBox("cases","다른 지역·나라의 해결 사례")}
   ${vis("alt")?`<div class="exbox" style="margin-top:12px"><b class="small">선생님이 공개한 대안 예시</b> <span class="small">그대로 옮기지 말고 우리 핵심 원인에 맞게 바꿔 씁니다.</span><ul>${ALT_EX.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:`<div style="margin-top:12px">${pendingBox("alt","해결 대안 예시")}</div>`}</div>`;
  const fb=`<div class="block"><h3>AI 피드백으로 대안 보완하기</h3><p class="hint">AI는 강점과 약점만 말합니다. 새 대안을 내거나 순위를 매기지 않습니다. 피드백마다 채택 여부와 이유를 적고, 보완한 대안을 우리 말로 씁니다.</p>
   ${d.fb?`<div class="tablewrap"><table><thead><tr><th>모둠 대안</th><th>AI의 피드백</th><th>채택 여부와 이유</th><th>보완한 대안</th></tr></thead><tbody>${d.fb.map((x,i)=>`<tr>
    <td><span class="small">${esc(TSHORT[x.type])}</span><br>${esc(x.alt)}</td>
    <td class="ai-ans"><b class="small">강점</b> ${esc(x.s)}<br><b class="small">약점</b> ${esc(x.w)}</td>
    <td><select data-d4="${i}"><option value="">선택</option>${["수용","수정","기각"].map(o=>`<option ${x.dec===o?"selected":""}>${o}</option>`).join("")}</select><input type="text" data-w4="${i}" value="${esc(x.why)}" placeholder="이유" style="margin-top:4px"></td>
    <td><textarea id="s4-fix${i}" data-fix4="${i}" placeholder="우리 말로 보완한 대안">${esc(x.fix)}</textarea>${redHtml("s4-fix"+i,x.fix)}</td></tr>`).join("")}</tbody></table></div>`:`<button class="btn primary" data-act="s4fb">AI 피드백 요청</button>`}</div>`;
  const lv=["상","중","하"];
  const cmp=`<div class="block"><h3>대안 비교표</h3><p class="hint">모둠이 토의해 보완한 대안을 세 기준으로 평가하고 근거를 씁니다.</p>
   ${d.fb?`<div class="tablewrap"><table><thead><tr><th>보완한 대안</th><th>실현 가능성</th><th>지속가능성</th><th>핵심 원인 해결 정도</th><th>평가 근거</th></tr></thead><tbody>${d.fb.map((x,i)=>`<tr><td>${esc(x.fix||x.alt)}</td>${[0,1,2].map(k=>`<td><select data-r4="${i}" data-k="${k}" aria-label="평가"><option value="">-</option>${lv.map(o=>`<option ${x.r[k]===o?"selected":""}>${o}</option>`).join("")}</select></td>`).join("")}<td><input type="text" data-rw4="${i}" value="${esc(x.rw)}" placeholder="왜 이렇게 평가했나"></td></tr>`).join("")}</tbody></table></div>`:""}</div>`;
  const first=`<div class="block"><h3>1순위 대안 직접 선정하기 <span class="ws">나 · 2번</span></h3><p class="hint">비교표를 근거로 모둠이 토의해 하나를 고르고, 다른 대안보다 나은 이유를 씁니다.</p>
   <div class="checks" style="font-size:14px;gap:6px">${(d.fb||[]).map((x,i)=>`<label style="white-space:normal"><input type="radio" name="s4first" data-first="${i}" ${d.first===i?"checked":""}> ${esc(x.fix||x.alt)} <span class="small">(${x.r.map(v=>v||"-").join("·")})</span></label>`).join("")}</div>
   <textarea id="s4-why" style="margin-top:8px" placeholder="비교표에서 어떤 점 때문에 이 대안을 골랐나요?">${esc(d.firstWhy)}</textarea>${redHtml("s4-why",d.firstWhy)}</div>`;
  return fl+core+altBlock+helps+lockWrap(!d.sealed,"대안을 3개 이상 만들고 겨냥하는 원인을 모두 적어야 AI 피드백이 열립니다.",fb)+lockWrap(!judged,"모든 피드백에 채택 여부, 이유, 보완한 대안을 적어야 열립니다.",cmp)+lockWrap(!rated,"비교표를 모두 채워야 1순위를 고를 수 있습니다.",first);
}

function s5(){
  const d=S.s5,firstAlt=S.s4.fb&&S.s4.first!==null?(S.s4.fb[S.s4.first].fix||S.s4.fb[S.s4.first].alt):"학교에 소형 전자제품 수거함을 설치해 달라고 요청한다 (4단계 미완료 시 예시)";
  const chosen=d.pick!==null&&d.whySaved;const L3="ABC";
  const fl=flowList([["① 반응 먼저 예측",d.sealed?"ok":"now"],["② AI 시나리오",d.sealed?(d.scen?"ok":"now"):"lock"],["③ 가능성 판단과 이유",d.scen?(chosen?"ok":"now"):"lock"],["④ 예상 못 한 문제",chosen?"now":"lock"]]);
  const p=`<div class="block first"><h3>이해관계자 반응 예측하기 <span class="ws">나 · 3번</span> ${d.sealed?`<span class="seal">봉인 ${esc(d.sealTime)}</span>`:""}</h3>
   <p class="small" style="margin:0 0 6px">우리 대안: <b>${esc(firstAlt)}</b></p>
   <p class="hint">이 대안이 실현되면 영향을 받는 사람은 누구일까요? 각자 어떻게 반응할지 근거와 함께 먼저 예상합니다.</p>
   ${listItems(d.preds,(i,x)=>x.who+(x.ex?" · 배제된 이해관계자":"")+aft("who",x.who),!d.sealed,"s5preds")}
   ${d.sealed?"":`<div class="addrow"><input type="text" id="s5-who" placeholder="이해관계자" style="flex:0 1 200px"><input type="text" id="s5-txt" placeholder="예상 반응과 근거"><button class="btn" data-act="s5add">추가</button></div>
   ${vis("who")?`<div class="exbox"><b class="small">선생님이 공개한 이해관계자 예시</b> <span class="small">누르면 이해관계자 칸에 들어갑니다. 반응은 모둠이 직접 예측합니다.</span><div class="chips">${WHO_EX.map(w=>`<button class="chipbtn" data-whoex="${esc(w)}">${esc(w)}</button>`).join("")}</div></div>`:pendingBox("who","이해관계자 예시")}
   <div class="exq"><b>배제된 사람은 없을까?</b><p class="small" style="margin:2px 0 8px">이 대안을 정하는 자리에 없었던 사람, 영향을 받지만 의견을 말하기 어려운 사람은 누구일까요? 한 명을 더 찾아 이해관계자로 추가해 봅시다.</p>
    <div class="altform"><input type="text" id="s5-exwho" placeholder="배제된 이해관계자"><input type="text" id="s5-exwhy" placeholder="왜 목소리를 내기 어려운가"><input type="text" id="s5-extxt" placeholder="예상 반응과 근거"><button class="btn" data-act="s5exadd">추가</button></div></div>
   <div class="row"><button class="btn primary" data-act="s5seal" ${d.preds.filter(p=>!p.ex).length<2||!d.preds.some(p=>p.ex)?"disabled":""}>예측 확정 · 시나리오 만들기</button><span class="small">이해관계자 ${d.preds.filter(p=>!p.ex).length}/2명 이상 · 배제된 이해관계자 ${d.preds.filter(p=>p.ex).length}/1명 이상</span></div>`}</div>`;

   <label class="small" for="s5-why" style="display:block;margin-top:12px">${d.pick!==null?`왜 시나리오 ${L3[d.pick]}가 가장 일어날 가능성이 높다고 생각했나요?`:"시나리오 A, B, C 가운데 하나를 먼저 고르세요."}</label><textarea id="s5-why" ${d.whySaved||d.pick===null?"readonly":""}>${esc(d.why)}</textarea>${redHtml("s5-why",d.why)}

function s6(){

   <div class="acttypes">${ACT_T.map((t,i)=>`<div><b>${t.n}</b><span class="small">${t.ex}</span></div>`).join("")}</div>
   <ul class="list" style="margin-top:10px">${d.acts.map((a,i)=>`<li><span class="tag">${esc(ACT_T[a.type].n)}</span><span class="txt">${esc(a.what)}<br><span class="small">대상: ${esc(a.target||"-")}</span></span><button class="x" data-del="s6acts" data-i="${i}">삭제</button></li>`).join("")}</ul>

  const scope=`<div class="block"><h3>④ 어디까지 할까요?</h3><p class="hint">수업 여건에 맞게 모둠이 정합니다. 실제로 실행하지 않아도 됩니다.</p>

   <div class="propform">
    <div class="pf"><span class="pf-k">문제</span><div>${esc(S.s5.newp||S.s3.core||"(앞 단계에서 아직 쓰지 않음)")}<span class="pf-src">5단계 새로운 문제</span></div></div>
    <div class="pf"><span class="pf-k">근거</span><div>${esc(S.s3.core||"(3단계 핵심 원인 없음)")}${ev.length?`<br><span class="small">근거 자료: ${esc(ev.join(", "))}</span>`:""}<span class="pf-src">3단계 핵심 원인·검증 자료</span></div></div>
    <div class="pf"><span class="pf-k">제안</span><div><textarea id="s6-ask" placeholder="무엇을 바꿔 달라고 할까요?">${esc(d.prop.ask)}</textarea></div></div>
    <div class="pf"><span class="pf-k">예상 반대와 대응</span><div>${ob.length?`<ul class="pf-ul">${ob.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="small">(5단계 반응 예측 없음)</span>'}<span class="pf-src">5단계 이해관계자 반응</span><textarea id="s6-reply" placeholder="반대하는 사람의 걱정에 어떻게 답할까요?" style="margin-top:6px">${esc(d.prop.reply)}</textarea></div></div>
    <div class="pf"><span class="pf-k">기대 효과</span><div><textarea id="s6-effect" placeholder="제안이 받아들여지면 무엇이 달라지나요?">${esc(d.prop.effect)}</textarea></div></div>
   </div>`:pendingBox("prop","③에서 제도 제안이나 요청·설득을 고르면 제안서 틀이 열립니다").replace("선생님이 공개하면 여기에 나타납니다. 그 전에 모둠이 먼저 생각해 봅시다.","")}</div>`;
  const plan=`<div class="block"><h3>⑥ 행동 계획표 <span class="ws">나 · 5번</span></h3><p class="hint">실행 주체, 방법, 예상되는 어려움과 대응, 제출 경로, 결과를 확인할 날짜를 씁니다.</p>
   <div class="tablewrap"><table style="min-width:900px"><thead><tr><th></th><th>실행 주체</th><th>방법</th><th>예상되는 어려움</th><th>대응 방법</th><th>제출 경로</th><th>결과 확인일</th></tr></thead><tbody>${d.plans.map((p,i)=>`<tr><td class="num">${i+1}</td>${["who","how","risk","resp","channel","date"].map(k=>`<td><input type="text" data-p6="${i}" data-k="${k}" value="${esc(p[k])}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <div class="row"><button class="btn" data-act="s6addplan">계획 추가</button></div></div>`;
  const allChk=d.chk.every(Boolean);
  const check=`<div class="block"><h3>⑦ 제출 전 점검</h3><p class="hint">밖으로 보내기 전에 모둠이 함께 확인합니다. 선생님이 확인해야 제출할 수 있습니다.</p>
   <div class="checks" style="font-size:14px;gap:6px">${CHK6.map((c,i)=>`<label style="white-space:normal"><input type="checkbox" data-chk6="${i}" ${d.chk[i]?"checked":""}> ${esc(c)}</label>`).join("")}</div>
   <div class="row">${d.ok?`<span class="seal">선생님 확인 완료</span>${d.tnote?`<span class="small">선생님: ${esc(d.tnote)}</span>`:""}`:allChk?'<span class="small">선생님 확인을 기다리는 중입니다. (시연: 교사 화면 → 6단계 행동계획에서 확인)</span>':'<span class="small">세 항목을 모두 확인해야 선생님께 확인 요청이 갑니다.</span>'}</div></div>`;
  const dates=d.plans.map(p=>p.date).filter(Boolean);
  const r=d.res;
  const result=`<div class="block"><h3>⑧ 결과 기록 <span class="small">후속 차시</span></h3><p class="hint">실천 결과는 수업 뒤에 나오는 경우가 많습니다. 결과 확인일${dates.length?`(${esc(dates.join(", "))})`:""}에 이 칸이 열리고, 7단계 공유나 다음 차시 도입에서 함께 이야기합니다.</p>
   ${d.resultOpen?`<div style="display:grid;gap:8px"><div><label class="small" for="s6-rw">무슨 일이 있었나요?</label><textarea id="s6-rw">${esc(r.what)}</textarea></div>
    <div><span class="small">예상과 같았나요?</span><div class="seg">${["예상과 같았다","예상과 달랐다"].map(v=>`<button class="${r.same===v?"on":""}" data-same="${v}">${v}</button>`).join("")}</div></div>
    ${r.same==="예상과 달랐다"?`<div><span class="small">어디로 돌아가 다시 탐구할까요?</span><div class="seg wrap">${["원인을 다시 (2·3단계)","대안을 다시 (4단계)","예측을 다시 (5단계)","이번에는 돌아가지 않는다"].map(v=>`<button class="${r.back===v?"on":""}" data-back="${v}">${v}</button>`).join("")}</div><label class="small" for="s6-rwhy" style="display:block;margin-top:6px">그렇게 판단한 이유</label><input type="text" id="s6-rwhy" value="${esc(r.why)}"></div>`:""}</div>`
   :`<div class="pend"><b>아직 결과 확인일이 아닙니다</b><span>결과 확인일이 되면 열립니다.</span><button class="demo-btn" style="margin:6px 0 0;align-self:flex-start" data-act="s6openres">시연: 결과 확인일로 가정하기</button></div>`}</div>`;
  return top+lvl+alt+acts+scope+prop+plan+check+result;
}

function s7(){
  const d=S.s7;
  const fb=S.s4.fb,first=fb&&S.s4.first!==null?(fb[S.s4.first].fix||fb[S.s4.first].alt):"";
  const chain=[["핵심 원인",S.s3.core],["자료 수집·검증",S.s3.rows.filter(r=>r.judge).map(r=>r.judge+": "+r.q).join(" / ")],["대안",S.s4.alts.map(a=>a.txt).join(" / ")],["AI 피드백 보완",fb?fb.map(f=>f.dec).filter(Boolean).join(", "):""],["1순위 대안",first],["결과 예측",S.s5.pick!==null?S.s5.scen[S.s5.pick].title:""],["새로운 대안",S.s6.newAlt],["행동",S.s6.acts.map(a=>ACT_T[a.type].n+": "+a.what).join(" / ")+(S.s6.scope?" ("+S.s6.scope+")":"")],["행동 계획",S.s6.plans.filter(p=>p.how).map(p=>p.who+" · "+p.how).join(" / ")]];
  const by=[1,3,4,5].map(n=>({n,seal:S.logs.filter(l=>l.stage===n&&l.kind==="seal").length,ai:S.logs.filter(l=>l.stage===n&&l.kind==="ai").length,red:S.logs.filter(l=>l.stage===n&&l.kind==="red").length}));
  return `<div class="block first"><h3>문제 해결 흐름 정리 (발표용)</h3><p class="hint">앞 단계에서 모둠이 쓴 내용이 자동으로 모입니다. 이 흐름에 따라 어떤 근거로 대안과 계획을 세웠는지 발표합니다.</p>
   <ul class="chain">${chain.map(([k,v])=>`<li><span>${esc(k)}</span><span>${v?esc(v):'<span class="small">아직 작성하지 않음</span>'}</span></li>`).join("")}</ul></div>
  <div class="block"><h3>동료 모둠 평가 <span class="ws">나 · 6번</span></h3><p class="hint">4: 매우 타당하다 · 3: 타당하다 · 2: 타당하지 않다 · 1: 매우 타당하지 않다</p>
   <div class="tablewrap"><table class="scale" style="min-width:520px"><thead><tr><th>#</th><th>검토 내용</th><th>4</th><th>3</th><th>2</th><th>1</th></tr></thead><tbody>${PEER.map((t,i)=>`<tr><td class="num">${i+1}</td><td>${esc(t)}</td>${[4,3,2,1].map(v=>`<td><input type="radio" name="peer${i}" data-peer="${i}" value="${v}" ${d.peer[i]===v?"checked":""} aria-label="${v}점"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:10px"><div><label class="small" for="s7-learn">발표한 모둠에게서 배울 점</label><textarea id="s7-learn">${esc(d.learn)}</textarea></div><div><label class="small" for="s7-cmp">우리 모둠과 비교 (보완할 점, 새로 알게 된 점)</label><textarea id="s7-cmp">${esc(d.compare)}</textarea></div></div></div>
  <div class="block"><h3>우리 모둠의 AI 사용 기록</h3><p class="hint">성찰은 이 기록에 근거합니다. 기록은 자동으로 모였고 고칠 수 없습니다.</p>
   <div class="tablewrap"><table style="min-width:420px"><thead><tr><th>단계</th><th>먼저 생각한 내용 봉인</th><th>AI 사용</th><th>Red 의심</th></tr></thead><tbody>${by.map(b=>`<tr><td>${b.n}단계</td><td class="num">${b.seal}</td><td class="num">${b.ai}</td><td class="num">${b.red}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="block"><h3>AI 활용 성찰 체크리스트</h3><p class="hint">AI를 사용해 문제를 해결해 본 경험을 돌아봅니다. (개인 작성)</p>
   <div class="tablewrap"><table class="scale"><thead><tr><th>#</th><th>AI 활용 내용</th><th>그렇다</th><th>보통이다</th><th>아니다</th></tr></thead><tbody>${CHECK.map((t,i)=>`<tr><td class="num">${i+1}</td><td>${esc(t)}</td>${["그렇다","보통이다","아니다"].map(v=>`<td><input type="radio" name="chk${i}" data-chk="${i}" value="${v}" ${d.chk[i]===v?"checked":""} aria-label="${v}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <label class="small" for="s7-new" style="display:block;margin-top:10px">AI를 사용하면서 처음에는 생각하지 못했지만 새롭게 알게 되거나 생각하게 된 것은?</label><textarea id="s7-new">${esc(d.newThought)}</textarea></div>
  <div class="block"><h3>다시 읽는 코피의 편지</h3><p class="hint">우리가 쓰던 전자제품이 어디로 가는지, 오늘 세운 계획을 앞으로 어떻게 이어 갈지 생각해 봅니다.</p></div>`;
}

function renderTeacher(){
  const groups=[{g:"1모둠",c:["d","d","d","p","w","w","w"],f:0},{g:"2모둠",c:["d","d","f","w","w","w","w"],f:1},{g:"3모둠 (서윤 외 3)",live:true},{g:"4모둠",c:["d","p","w","w","w","w","w"],f:0},{g:"5모둠",c:["d","d","d","d","p","w","w"],f:0},{g:"6모둠",c:["d","d","d","p","w","w","w"],f:0}];
  const live=STAGES.map(st=>stageDone(st.n)?"d":S.logs.some(l=>l.stage===st.n&&l.kind==="red")?"f":st.n===S.stage?"p":"w");
  const lf=S.logs.filter(l=>l.kind==="red").length;

  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const m={s1qs:S.s1.qs,s1qs2:S.s1.qs2,s2causes:S.s2.causes,s2vq:S.s2.vq,s4alts:S.s4.alts,s5preds:S.s5.preds,s6acts:S.s6.acts};m[b.dataset.del].splice(+b.dataset.i,1);render()});

  const addFrom=(id,arr,k)=>{const el=$(id);if(el&&el.value.trim()){const t=el.value.trim();arr.push(t);if(k)markAfter(k,t);render()}};
  document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{DEMO[+b.dataset.demo]();render()});
  document.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{const k=b.dataset.rev,m=b.dataset.m,r=S.rev[k],meta=REV.find(x=>x.k===k);if(m==="hide"){r.all=false;r.g=false;log(meta.stage,"rev","도움 자료 숨김: "+meta.name)}else{r[m]=true;r.t=now();log(meta.stage,"rev","도움 자료 공개("+(m==="all"?"전체":"3모둠")+"): "+meta.name)}render()});
  const inp=(id,f)=>{const el=$(id);if(el)el.addEventListener("input",()=>f(el.value))};

  A("s1add",()=>addFrom("#s1-new",S.s1.qs,"q1"));
  A("s1seal",()=>{S.s1.sealed=true;S.s1.sealTime=now();S.s1.deadline=Date.now()+600000;log(1,"seal","질문 "+S.s1.qs.length+"개 합의·봉인");S.s1.chat.push({r:"sys",x:"질문이 봉인되었습니다. 10분 대화를 시작합니다."});render()});
  const send=(pick,arr,tag)=>{const q=$(pick).value;if(!q)return;arr.push(q);S.s1.chat.push({r:"me",x:q},{r:"ai",x:KOFI[q]||KOFI_DEFAULT});log(1,"ai","페르소나 질의"+tag+": "+q);render()};
  A("s1send",()=>send("#s1-pick",S.s1.asked,""));
  A("s1pause",()=>{S.s1.paused=true;S.s1.chat.push({r:"sys",x:"대화가 멈췄습니다. 더 물어볼 것이 있는지 모둠이 논의하세요."});render()});
  inp("#s1-disc",v=>S.s1.discuss=v);
  A("s1add2",()=>addFrom("#s1-new2",S.s1.qs2));
  A("s1seal2",()=>{S.s1.sealed2=true;S.s1.sealTime2=now();log(1,"seal","논의 결과·추가 질문 "+S.s1.qs2.length+"개 봉인");render()});
  A("s1send2",()=>send("#s1-pick2",S.s1.asked2,"(2차)"));
  // 2
  document.querySelectorAll("[data-ox]").forEach(b=>b.onclick=()=>{S.s2.qa[+b.dataset.ox]=b.dataset.v;render()});
  document.querySelectorAll("[data-qa]").forEach(el=>{el.addEventListener("input",()=>S.s2.qa[+el.dataset.qa]=el.value);el.addEventListener("change",render)});
  inp("#s2-diff",v=>S.s2.diff=v);A("s2c",()=>addFrom("#s2-c",S.s2.causes));A("s2v",()=>addFrom("#s2-v",S.s2.vq,"q2"));
  inp("#s2-same",v=>S.s2.life.same=v);inp("#s2-place",v=>S.s2.life.place=v);inp("#s2-impact",v=>S.s2.life.impact=v);
  document.querySelectorAll("[data-dev]").forEach(el=>el.onchange=()=>S.s2.life.dev[+el.dataset.dev].how=el.value);
  // 3
  document.querySelectorAll("[data-ask3]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ask3,r=S.s3.rows[i];r.ans=SEARCH[i%2];log(3,"ai","자료 수집 질의("+r.who+"): "+r.q);render()});
  document.querySelectorAll("[data-src3]").forEach(el=>el.onchange=()=>{S.s3.rows[+el.dataset.src3].src=el.value;render()});
  document.querySelectorAll("[data-c3]").forEach(el=>el.onchange=()=>{S.s3.rows[+el.dataset.c3].c[+el.dataset.k]=el.checked;render()});
  document.querySelectorAll("[data-j3]").forEach(el=>el.onchange=()=>{S.s3.rows[+el.dataset.j3].judge=el.value;render()});
  bindRed($("#s3-core"),"s3-core",3,v=>S.s3.core=v);
  // 4
  A("s4add",()=>{const t=$("#s4-txt").value.trim();if(!t)return;S.s4.alts.push({txt:t,cause:$("#s4-cause").value.trim(),type:+$("#s4-type").value});if(vis("cases")||vis("alt"))S.after.add("alt4|"+t);render()});
  A("s4seal",()=>{S.s4.sealed=true;S.s4.sealTime=now();log(4,"seal","대안 "+S.s4.alts.length+"개 봉인 (사례 공개 후 "+S.s4.alts.filter(a=>S.after.has("alt4|"+a.txt)).length+"개)");render()});
  A("s4fb",()=>{S.s4.fb=S.s4.alts.map(a=>({alt:a.txt,type:a.type,s:FBT[a.type][0],w:FBT[a.type][1],dec:"",why:"",fix:"",r:["","",""],rw:""}));log(4,"ai","대안 피드백 요청");render()});
  document.querySelectorAll("[data-note]").forEach(el=>el.addEventListener("input",()=>S.s4.notes[+el.dataset.note][el.dataset.k]=el.value));
  document.querySelectorAll("[data-r4]").forEach(el=>el.onchange=()=>{S.s4.fb[+el.dataset.r4].r[+el.dataset.k]=el.value;render()});
  document.querySelectorAll("[data-rw4]").forEach(el=>el.onchange=()=>{S.s4.fb[+el.dataset.rw4].rw=el.value;render()});
  document.querySelectorAll("[data-d4]").forEach(el=>el.onchange=()=>{S.s4.fb[+el.dataset.d4].dec=el.value;render()});
  document.querySelectorAll("[data-w4]").forEach(el=>el.onchange=()=>{S.s4.fb[+el.dataset.w4].why=el.value;render()});
  document.querySelectorAll("[data-fix4]").forEach(el=>{const i=+el.dataset.fix4;bindRed(el,"s4-fix"+i,4,v=>S.s4.fb[i].fix=v);el.addEventListener("change",render)});
  document.querySelectorAll("[data-first]").forEach(el=>el.onchange=()=>{S.s4.first=+el.dataset.first;render()});
  bindRed($("#s4-why"),"s4-why",4,v=>S.s4.firstWhy=v);
  // 5
  A("s5add",()=>{const w=$("#s5-who").value.trim(),t=$("#s5-txt").value.trim();if(w&&t){S.s5.preds.push({who:w,txt:t});markAfter("who",w);render()}});
  A("s5exadd",()=>{const w=$("#s5-exwho").value.trim(),y=$("#s5-exwhy").value.trim(),t=$("#s5-extxt").value.trim();if(w&&t){S.s5.preds.push({who:w,txt:t,why:y,ex:true});render()}});
  document.querySelectorAll("[data-whoex]").forEach(b=>b.onclick=()=>{const el=$("#s5-who");el.value=b.dataset.whoex;$("#s5-txt").focus()});
  A("s5seal",()=>{S.s5.sealed=true;S.s5.sealTime=now();log(5,"seal","이해관계자 반응 예측 "+S.s5.preds.length+"개 봉인 (배제된 이해관계자 "+S.s5.preds.filter(p=>p.ex).length+"명)");render()});
  A("s5sim",()=>{S.s5.scen=SCEN;log(5,"ai","시나리오 생성 (3개)");render()});
  document.querySelectorAll("[data-pick]").forEach(el=>el.onchange=()=>{S.s5.pick=+el.dataset.pick;render()});
  const w5=$("#s5-why");if(w5)bindRed(w5,"s5-why",5,v=>S.s5.why=v);
  A("s5save",()=>{if(S.s5.why.trim().length<20){const m=$("#s5-msg");m.textContent="이유를 조금 더 자세히 써야 저장됩니다.";m.style.color="var(--r)";$("#s5-why").focus();return}S.s5.whySaved=true;S.s5.whyTime=now();log(5,"seal","시나리오 "+"ABC"[S.s5.pick]+" 선택 이유 저장");render()});
  A("s5edit",()=>{S.s5.whySaved=false;render()});
  bindRed($("#s5-newp"),"s5-newp",5,v=>S.s5.newp=v);
  // 6
  bindRed($("#s6-new"),"s6-new",6,v=>S.s6.newAlt=v);
  const fz=$("#s6-fz");if(fz)fz.onchange=()=>S.s6.fz=fz.checked;const ss=$("#s6-ss");if(ss)ss.onchange=()=>S.s6.ss=ss.checked;
  document.querySelectorAll("[data-p6]").forEach(el=>{el.addEventListener("input",()=>S.s6.plans[+el.dataset.p6][el.dataset.k]=el.value);if(el.dataset.k==="date")el.addEventListener("change",render)});
  document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.s6.level=b.dataset.lv;render()});
  A("s6addact",()=>{const w=$("#s6-aw").value.trim();if(!w)return;S.s6.acts.push({type:+$("#s6-at").value,what:w,target:$("#s6-ag").value.trim()});render()});
  document.querySelectorAll("[data-scope]").forEach(el=>el.onchange=()=>{S.s6.scope=el.dataset.scope;log(6,"seal","실행 범위: "+S.s6.scope);render()});
  inp("#s6-ask",v=>S.s6.prop.ask=v);inp("#s6-reply",v=>S.s6.prop.reply=v);inp("#s6-effect",v=>S.s6.prop.effect=v);
  A("s6addplan",()=>{S.s6.plans.push({who:"",how:"",risk:"",resp:"",channel:"",date:""});render()});
  document.querySelectorAll("[data-chk6]").forEach(el=>el.onchange=()=>{S.s6.chk[+el.dataset.chk6]=el.checked;if(S.s6.chk.every(Boolean))log(6,"seal","제출 전 점검 완료 · 선생님 확인 요청");render()});
  A("s6openres",()=>{S.s6.resultOpen=true;render()});
  inp("#s6-rw",v=>S.s6.res.what=v);inp("#s6-rwhy",v=>S.s6.res.why=v);
  document.querySelectorAll("[data-same]").forEach(b=>b.onclick=()=>{S.s6.res.same=b.dataset.same;render()});
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{S.s6.res.back=b.dataset.back;log(6,"seal","재탐구 결정: "+b.dataset.back);render()});
  A("t6ok",()=>{S.s6.ok=true;S.s6.tnote=($("#t6-note")||{}).value||"";log(6,"seal","선생님 제출 확인");render()});
  // 7
  document.querySelectorAll("[data-peer]").forEach(el=>el.onchange=()=>S.s7.peer[+el.dataset.peer]=+el.value);
  document.querySelectorAll("[data-chk]").forEach(el=>el.onchange=()=>{S.s7.chk[+el.dataset.chk]=el.value});
  inp("#s7-learn",v=>S.s7.learn=v);inp("#s7-cmp",v=>S.s7.compare=v);inp("#s7-new",v=>S.s7.newThought=v);
}
setInterval(()=>{const t=document.getElementById("s1-timer");if(t&&S.s1.deadline){t.textContent=timerText();t.classList.toggle("low",S.s1.deadline-Date.now()<120000)}},1000);
["student","teacher","plan"].forEach(v=>$("#v-"+v).onclick=()=>{S.view=v;render()});
render();
})();
</script>
