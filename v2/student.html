<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<title>AI-EPS 학생</title>
<link rel="manifest" href="manifest-student.webmanifest">
</head>
<body>
<div id="top"></div>
<div class="shell" id="app"><p class="empty">불러오는 중…</p></div>
<dialog id="helpdlg" class="panel" style="max-width:560px;border:1px solid var(--line);color:var(--ink)">
  <h2 style="margin:0 0 8px;font-size:19px">이렇게 써요</h2>
  <ul style="margin:0 0 12px;padding-left:18px;font-size:14px">
    <li><b>노란불 단계(1·3·4·5단계)</b>: 모둠이 먼저 생각한 것을 저장하면 봉인됩니다. 선생님이 확인하고 열어야 AI를 쓸 수 있습니다.</li>
    <li><b>AI 미사용 단계(2·6·7단계)</b>: 화면에 AI 창이 없습니다. 모둠이 직접 생각하고 토의합니다.</li>
    <li>AI의 답은 정답이 아닙니다. 우리 말로 다시 쓰고, 출처에 직접 들어가 확인합니다.</li>
    <li>입력한 내용은 자동으로 저장되고 같은 모둠의 다른 기기에도 보입니다.</li>
    <li>다른 기기에서 다시 들어올 때는 같은 이름과 비밀번호를 넣습니다.</li>
  </ul>
  <form method="dialog"><button class="btn primary">닫기</button></form>
</dialog>
<script type="module" src="js/student.js"></script>
</body>
</html>
